server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /v1/ {
        proxy_pass http://platform:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The web client holds the consent page of a site sign-in (SITE-027). No other page may frame
    # it, so that a site cannot make the owner click "Sign in" inside a hidden frame. The headers
    # are on the static pages only: the /v1/ answers keep the headers that Edge sets.
    location / {
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options DENY always;
        try_files $uri $uri/ /index.html;
    }
}
