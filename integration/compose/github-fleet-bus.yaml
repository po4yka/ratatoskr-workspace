name: ratatoskr-${RATATOSKR_TASK_NAMESPACE:?set a unique ghb017 task namespace}

x-ratatoskr-inputs:
  platform_context: ${RATATOSKR_PLATFORM_CONTEXT:?set the Platform checkout}
  platform_revision: ${RATATOSKR_PLATFORM_REVISION:?set the Platform revision}
  github_context: ${RATATOSKR_GITHUB_CONTEXT:?set the GitHub checkout}
  github_revision: ${RATATOSKR_GITHUB_REVISION:?set the GitHub revision}
  runtime_dir: ${RATATOSKR_GHB017_RUNTIME_DIR:?set the generated GHB-017 runtime directory}

x-ratatoskr-fleet-bus-contract:
  inbound:
    - cmd.github.sync.requested.v1
    - evt.knowledge.repository_analysis.completed.v1
    - evt.knowledge.repository_analysis.failed.v1
    - evt.vault.backup_policy.acknowledged.v1
  outbound:
    - evt.knowledge.repository_analysis.requested.v1
    - cmd.vault.target.desired.v1
  durables:
    - ratatoskr_github_sync
    - ratatoskr_github_analysis_completed
    - ratatoskr_github_analysis_failed
    - ratatoskr_github_vault_policy_ack

services:
  network:
    image: nats@sha256:d4ac35882ac65aff236cd65b9d3fa4d24332c681e1a85f94eedccd3cdd65b1da
    entrypoint: [/bin/sh, -c]
    command: [sleep infinity]
    ports:
      - 127.0.0.1::8092
      - 127.0.0.1::9469

  postgres:
    image: postgres:17
    network_mode: service:network
    depends_on:
      network:
        condition: service_started
    environment:
      POSTGRES_DB: github
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=und-x-icu --encoding=UTF8
      POSTGRES_USER: github
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U github -d github"]
      interval: 1s
      timeout: 5s
      retries: 60
    volumes:
      - postgres-data:/var/lib/postgresql/data

  nats:
    image: nats@sha256:d4ac35882ac65aff236cd65b9d3fa4d24332c681e1a85f94eedccd3cdd65b1da
    network_mode: service:network
    depends_on:
      network:
        condition: service_started
    command: [-c, /run/ghb017/nats.conf]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O- http://127.0.0.1:8222/healthz | grep -q ok"]
      interval: 1s
      timeout: 5s
      retries: 60
    volumes:
      - ${RATATOSKR_GHB017_RUNTIME_DIR:?set the runtime directory}:/run/ghb017:ro
      - nats-data:/data

  fake-github:
    image: python@sha256:540c7d91f98ff6880174c40e99067bf5941eb54d818a7a5e094d188b196a934d
    network_mode: service:network
    depends_on:
      network:
        condition: service_started
    command: [python3, /fixture/github-fake-api.py]
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18081/health', timeout=1)"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - ../fixtures/github-fake-api.py:/fixture/github-fake-api.py:ro
      - ${RATATOSKR_GHB017_RUNTIME_DIR:?set the runtime directory}/state:/state

  topology:
    image: natsio/nats-box@sha256:9d5f35d286c3dcfca18bb2339b51345f9f89b580b237ab16ddfe609bdca9c72d
    network_mode: service:network
    depends_on:
      nats:
        condition: service_healthy
    command: [/fixture/github-provision-topology.sh]
    volumes:
      - ../fixtures/github-provision-topology.sh:/fixture/github-provision-topology.sh:ro
      - ${RATATOSKR_PLATFORM_CONTEXT:?set the Platform checkout}:/platform:ro
      - ${RATATOSKR_GHB017_RUNTIME_DIR:?set the runtime directory}:/run/ghb017:ro

  github:
    build:
      context: ${RATATOSKR_GITHUB_CONTEXT:?set the GitHub checkout}
      dockerfile_inline: |
        FROM rust:1.97-bookworm AS builder
        RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates git pkg-config && rm -rf /var/lib/apt/lists/*
        WORKDIR /build
        ARG RATATOSKR_GIT_SHA=unknown
        ENV RATATOSKR_GIT_SHA=$${RATATOSKR_GIT_SHA}
        COPY . .
        RUN cargo build --release --locked -p ratatoskr-github-catalog-service --bin ratatoskr-github-catalog --jobs 2
        FROM debian:12-slim
        RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates && rm -rf /var/lib/apt/lists/* && useradd --system --no-create-home --shell /usr/sbin/nologin ratatoskr-github
        COPY --from=builder /build/target/release/ratatoskr-github-catalog /usr/local/bin/
        USER ratatoskr-github
        ENTRYPOINT ["ratatoskr-github-catalog"]
      args:
        RATATOSKR_GIT_SHA: ${RATATOSKR_GITHUB_REVISION:?set the GitHub revision}
    image: ratatoskr-ghb017-github:${RATATOSKR_GITHUB_REVISION:?set the GitHub revision}
    network_mode: service:network
    init: true
    stop_grace_period: 12s
    depends_on:
      fake-github:
        condition: service_healthy
      postgres:
        condition: service_healthy
      topology:
        condition: service_completed_successfully
    environment:
      RATATOSKR__ADMIN__LISTEN_ADDRESS: 0.0.0.0:9469
      RATATOSKR__API__LISTEN_ADDRESS: 0.0.0.0:8092
      RATATOSKR__BUS__URL: nats://127.0.0.1:4222
      RATATOSKR__BUS__NKEY_SEED_PATH: /run/ghb017/github.nkey
      RATATOSKR__BUS__CONNECT_TIMEOUT_MS: 5000
      RATATOSKR__BUS__PUBLISH_ACK_TIMEOUT_MS: 5000
      RATATOSKR__BUS__POLL_INTERVAL_MS: 100
      RATATOSKR__BUS__LEASE_MS: 5000
      RATATOSKR__BUS__BATCH_SIZE: 16
      RATATOSKR__BUS__MAX_ATTEMPTS: 10
      RATATOSKR__BUS__WORKER_JOIN_TIMEOUT_MS: 5000
      RATATOSKR__CREDENTIALS__ENCRYPTION_KEY_PATH: /run/ghb017/credential-key
      RATATOSKR__CREDENTIALS__KEY_VERSION: ghb017-fixture
      RATATOSKR__LIMITS__SHUTDOWN_TIMEOUT_MS: 10000
      RATATOSKR__PROVIDER__BASE_URL: http://127.0.0.1:18081
      RATATOSKR__STORAGE__DATABASE_URL: postgres://github@127.0.0.1:5432/github
    healthcheck:
      test: [CMD-SHELL, "grep -qi ':24FD ' /proc/net/tcp /proc/net/tcp6 2>/dev/null"]
      interval: 1s
      timeout: 3s
      retries: 120
    volumes:
      - ${RATATOSKR_GHB017_RUNTIME_DIR:?set the runtime directory}:/run/ghb017:ro

  peers:
    image: natsio/nats-box@sha256:9d5f35d286c3dcfca18bb2339b51345f9f89b580b237ab16ddfe609bdca9c72d
    network_mode: service:network
    command: [sleep, infinity]
    depends_on:
      topology:
        condition: service_completed_successfully
    volumes:
      - ${RATATOSKR_GHB017_RUNTIME_DIR:?set the runtime directory}:/run/ghb017:ro

volumes:
  nats-data:
  postgres-data:
