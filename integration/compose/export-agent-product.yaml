name: ratatoskr-${RATATOSKR_TASK_NAMESPACE:?set a unique task namespace}

x-ratatoskr-inputs:
  runtime_dir: ${RATATOSKR_XPA020_RUNTIME_DIR:?set the task runtime directory}
  contracts_context: ${RATATOSKR_CONTRACTS_CONTEXT:?set the Contracts checkout}
  contracts_revision: ${RATATOSKR_CONTRACTS_REVISION:?set the Contracts revision}
  platform_context: ${RATATOSKR_PLATFORM_CONTEXT:?set the Platform checkout}
  platform_revision: ${RATATOSKR_PLATFORM_REVISION:?set the Platform revision}
  chatgpt_context: ${RATATOSKR_CHATGPT_CONTEXT:?set the ChatGPT checkout}
  chatgpt_revision: ${RATATOSKR_CHATGPT_REVISION:?set the ChatGPT revision}
  claude_context: ${RATATOSKR_CLAUDE_CONTEXT:?set the Claude checkout}
  claude_revision: ${RATATOSKR_CLAUDE_REVISION:?set the Claude revision}
  export_agent_context: ${RATATOSKR_EXPORT_AGENT_CONTEXT:?set the Export Agent checkout}
  export_agent_revision: ${RATATOSKR_EXPORT_AGENT_REVISION:?set the Export Agent revision}
  workspace_context: ${RATATOSKR_WORKSPACE_CONTEXT:?set the workspace checkout}
  workspace_revision: ${RATATOSKR_WORKSPACE_REVISION:?set the workspace revision}

services:
  # Platform and both archive services deliberately share one disposable network namespace. This
  # makes the fixed 127.0.0.1 receipt boundaries real without publishing a provider listener on a
  # Docker bridge. Only dynamically allocated host ports below escape the namespace.
  network:
    image: alpine:3.22
    command: [sh, -euc, "trap 'exit 0' TERM INT; while :; do sleep 3600 & wait $!; done"]
    ports:
      - 127.0.0.1::8080
      - 127.0.0.1::8096
      - 127.0.0.1::8097
      - 127.0.0.1::8443
      - 127.0.0.1::9464

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=und-x-icu --encoding=UTF8
      POSTGRES_USER: postgres
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d postgres"]
      interval: 1s
      timeout: 5s
      retries: 60
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../fixtures/export-agent-product-init.sql:/docker-entrypoint-initdb.d/10-xpa020.sql:ro

  nats:
    image: nats:2.11-alpine
    command: [-c, /etc/nats/ratatoskr.conf]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O- http://127.0.0.1:8222/healthz | grep -q ok"]
      interval: 1s
      timeout: 5s
      retries: 60
    volumes:
      - nats-data:/data
      - ${RATATOSKR_XPA020_RUNTIME_DIR:?set the task runtime directory}/nats/ratatoskr.conf:/etc/nats/ratatoskr.conf:ro

  platform:
    build:
      context: ${RATATOSKR_PLATFORM_CONTEXT:?set the Platform checkout}
      args:
        RATATOSKR_GIT_SHA: ${RATATOSKR_PLATFORM_REVISION:?set the Platform revision}
    command: [ratatoskr-edge]
    network_mode: service:network
    environment:
      RATATOSKR__ADMIN__BIND: 127.0.0.1:9464
      RATATOSKR__ARCHIVE_STAGING__ROOT: /tmp/xpa020-archive-staging
      RATATOSKR__BUS__NKEY_SEED_PATH: /run/xpa020/nats/edge.nkey
      RATATOSKR__BUS__URL: nats://nats:4222
      RATATOSKR__DATABASE__URL: postgres://platform@postgres:5432/platform
      RATATOSKR__GATEWAY__ROUTES__CHATGPT__ARCHIVE_RECEIPT_PATH: /v1/ai-archives/receipt
      RATATOSKR__GATEWAY__ROUTES__CHATGPT__CLASS: transfer
      RATATOSKR__GATEWAY__ROUTES__CHATGPT__LISTENER: 127.0.0.1:8096
      RATATOSKR__GATEWAY__ROUTES__CHATGPT__PREFIX: /v1/chatgpt
      RATATOSKR__GATEWAY__ROUTES__CLAUDE__ARCHIVE_RECEIPT_PATH: /v1/ai-archives/receipt
      RATATOSKR__GATEWAY__ROUTES__CLAUDE__CLASS: transfer
      RATATOSKR__GATEWAY__ROUTES__CLAUDE__LISTENER: 127.0.0.1:8097
      RATATOSKR__GATEWAY__ROUTES__CLAUDE__PREFIX: /v1/claude
      RATATOSKR__PUBLIC__BIND: 127.0.0.1:8080
      RATATOSKR__PUBLIC__MAX_BODY_BYTES: 104857600
      RATATOSKR__PUBLIC__REQUEST_TIMEOUT_SECONDS: 300
      RATATOSKR__TELEMETRY__LOG_FILTER: info
      RATATOSKR__TELEMETRY__LOG_FORMAT: json
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
      network:
        condition: service_started
    healthcheck:
      test: [CMD-SHELL, "grep -qi ':1F90 ' /proc/net/tcp /proc/net/tcp6 2>/dev/null"]
      interval: 1s
      timeout: 5s
      retries: 90
    volumes:
      - ${RATATOSKR_XPA020_RUNTIME_DIR:?set the task runtime directory}/nats/edge.nkey:/run/xpa020/nats/edge.nkey:ro

  chatgpt:
    build:
      context: ${RATATOSKR_CHATGPT_CONTEXT:?set the ChatGPT checkout}
      args:
        RATATOSKR_GIT_SHA: ${RATATOSKR_CHATGPT_REVISION:?set the ChatGPT revision}
      dockerfile_inline: |
        FROM rust:1.97.0-slim-bookworm AS builder
        RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates git pkg-config && rm -rf /var/lib/apt/lists/*
        WORKDIR /build
        ARG RATATOSKR_GIT_SHA=unknown
        ENV RATATOSKR_GIT_SHA=$${RATATOSKR_GIT_SHA}
        COPY . .
        RUN cargo build --release --locked -p ratatoskr-chatgpt-archive-service
        FROM debian:12-slim
        RUN useradd --system --no-create-home --shell /usr/sbin/nologin ratatoskr
        COPY --from=builder /build/target/release/ratatoskr-chatgpt-archive-service /usr/local/bin/
        USER ratatoskr
        ENTRYPOINT ["ratatoskr-chatgpt-archive-service"]
    network_mode: service:network
    environment:
      RATATOSKR__ADMIN__LISTEN_ADDRESS: 127.0.0.1:8096
      RATATOSKR__RECEIPT__EVENT_BUS_NKEY_SEED_PATH: /run/xpa020/nats/chatgpt.nkey
      RATATOSKR__RECEIPT__EVENT_BUS_URL: nats://nats:4222
      RATATOSKR__RECEIPT__PLATFORM_ACCOUNTS: 01980000-0000-7000-8000-000000000001=xpa020-chatgpt
      RATATOSKR__STORAGE__BLOB_ROOT: /tmp/xpa020-chatgpt/blobs
      RATATOSKR__STORAGE__DATABASE_URL: postgres://chatgpt@postgres:5432/chatgpt
      RATATOSKR__STORAGE__RECEIPT_STAGING_ROOT: /tmp/xpa020-chatgpt/staging
      RATATOSKR__TELEMETRY__LOG_FILTER: info
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
      network:
        condition: service_started
    healthcheck:
      test: [CMD-SHELL, "grep -qi ':1FA0 ' /proc/net/tcp /proc/net/tcp6 2>/dev/null"]
      interval: 1s
      timeout: 5s
      retries: 90
    volumes:
      - ${RATATOSKR_XPA020_RUNTIME_DIR:?set the task runtime directory}/nats/chatgpt.nkey:/run/xpa020/nats/chatgpt.nkey:ro

  claude:
    build:
      context: ${RATATOSKR_CLAUDE_CONTEXT:?set the Claude checkout}
      args:
        RATATOSKR_GIT_SHA: ${RATATOSKR_CLAUDE_REVISION:?set the Claude revision}
      dockerfile_inline: |
        FROM rust:1.97.0-slim-bookworm AS builder
        RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates git pkg-config && rm -rf /var/lib/apt/lists/*
        WORKDIR /build
        ARG RATATOSKR_GIT_SHA=unknown
        ENV RATATOSKR_GIT_SHA=$${RATATOSKR_GIT_SHA}
        COPY . .
        RUN cargo build --release --locked -p ratatoskr-claude-archive-service
        FROM debian:12-slim
        RUN useradd --system --no-create-home --shell /usr/sbin/nologin ratatoskr
        COPY --from=builder /build/target/release/ratatoskr-claude-archive-service /usr/local/bin/
        USER ratatoskr
        ENTRYPOINT ["ratatoskr-claude-archive-service"]
    network_mode: service:network
    environment:
      RATATOSKR__ADMIN__LISTEN_ADDRESS: 127.0.0.1:8097
      RATATOSKR__RECEIPT__EVENT_BUS_NKEY_SEED_PATH: /run/xpa020/nats/claude.nkey
      RATATOSKR__RECEIPT__EVENT_BUS_URL: nats://nats:4222
      RATATOSKR__RECEIPT__PLATFORM_ACCOUNTS: 01980000-0000-7000-8000-000000000001=01980000-0000-7000-8000-000000000003
      RATATOSKR__STORAGE__BLOB_ROOT: /tmp/xpa020-claude/blobs
      RATATOSKR__STORAGE__DATABASE_URL: postgres://claude@postgres:5432/claude
      RATATOSKR__TELEMETRY__LOG_FILTER: info
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
      network:
        condition: service_started
    healthcheck:
      test: [CMD-SHELL, "grep -qi ':1FA1 ' /proc/net/tcp /proc/net/tcp6 2>/dev/null"]
      interval: 1s
      timeout: 5s
      retries: 90
    volumes:
      - ${RATATOSKR_XPA020_RUNTIME_DIR:?set the task runtime directory}/nats/claude.nkey:/run/xpa020/nats/claude.nkey:ro

  seed:
    image: postgres:17
    depends_on:
      platform:
        condition: service_healthy
      chatgpt:
        condition: service_healthy
      claude:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: postgres
    command: [psql, -v, ON_ERROR_STOP=1, -f, /seed/runtime.sql]
    volumes:
      - ../fixtures/export-agent-product-runtime.sql:/seed/runtime.sql:ro

  tls-edge:
    image: nginx:1.28-alpine
    network_mode: service:network
    depends_on:
      platform:
        condition: service_healthy
      network:
        condition: service_started
      seed:
        condition: service_completed_successfully
    volumes:
      - ../nginx/export-agent-product.conf:/etc/nginx/conf.d/default.conf:ro
      - ${RATATOSKR_XPA020_RUNTIME_DIR:?set the task runtime directory}/tls/server.crt:/run/xpa020/tls/server.crt:ro
      - ${RATATOSKR_XPA020_RUNTIME_DIR:?set the task runtime directory}/tls/server.key:/run/xpa020/tls/server.key:ro

volumes:
  postgres-data:
  nats-data:
