[workspace]
resolver = "3"
members = [
    "crates/workspace-core",
    "crates/workspace-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "BSD-3-Clause"
repository = "https://github.com/po4yka/ratatoskr-workspace"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"
toml = "=1.1.4"
workspace-core = { version = "0.1.0", path = "crates/workspace-core" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
indexing_slicing = "deny"
string_slice = "deny"

[profile.release]
debug = 1
