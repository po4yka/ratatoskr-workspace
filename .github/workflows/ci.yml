name: workspace snapshot

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly on main, so a date-dependent test or a runner change is caught without a push.
    - cron: "58 4 * * 1"

permissions:
  contents: read

concurrency:
  group: workspace-snapshot-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Separate from the snapshot so a new RustSec advisory cannot hide a lint, test or snapshot failure.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.19.0 --locked # zizmor: ignore[adhoc-packages]

      - name: Dependency policy and advisories
        working-directory: harness
        run: cargo deny check

  # The publishing workflow the service repositories call, run end to end against a fixture without
  # publishing. Its refusals are covered by `release_artifact_check.rs`; this proves the build, the
  # check and the SBOM steps work together on the runner the callers get.
  release-artifact-selftest:
    permissions:
      contents: read
      # The three below are requested by the called job for its publish half. With
      # `publish: false` nothing is pushed or attested, but a called job may not ask for more than
      # its caller grants.
      packages: write      # ghcr.io push, unused here
      id-token: write      # attestation signing, unused here
      attestations: write  # attestation record, unused here
    uses: ./.github/workflows/reusable-release-artifact.yml
    with:
      context: harness/fixtures/release-artifact
      units: harness/fixtures/release-artifact/deploy/systemd
      publish: false

  # The single-host playbook, converged on a disposable Debian 12 arm64 stand-in with systemd and
  # its own Docker daemon, run a second time with zero changes, then verified (openspec
  # host-provisioning). It installs the published, attested artifacts of the pinned commits, so it
  # needs `oras` and `gh` and reads ghcr.io with the job's own token; it touches no real host.
  molecule:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install oras
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Install the pinned Molecule toolchain
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet \
            ansible-core==2.18.19 molecule==26.10.0 'molecule-plugins[docker]==26.10.12' docker==7.2.0 # zizmor: ignore[adhoc-packages]
          "$RUNNER_TEMP/venv/bin/ansible-galaxy" collection install community.docker:==5.3.0 ansible.posix:==2.2.2
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Converge, idempotence and verify
        working-directory: deploy/ansible
        env:
          GH_TOKEN: ${{ github.token }}  # gh attestation verify reads the public attestations
        run: molecule test

  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive

      - name: Use the committed Rust toolchain
        working-directory: harness
        run: |
          test -f rust-toolchain.toml
          grep -F 'channel = "1.97.0"' rust-toolchain.toml
          cargo --version

      - name: Rust formatting
        working-directory: harness
        run: cargo fmt --all -- --check

      - name: Rust lints
        working-directory: harness
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Rust tests
        working-directory: harness
        run: cargo test --workspace --all-features --locked

      - name: Committed snapshot is reproducible
        run: |
          test -f harness/rust-toolchain.toml
          ./ws lock check
          ./ws doctor
