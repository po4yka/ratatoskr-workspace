id: DPL-022
state: verified
goal: Provision the single host from pinned, verified sources with one idempotent Ansible playbook, and publish an attested linux/arm64 artifact for every commit on main of each repository that ships a systemd unit.
openspec_change: add-deployment-automation
authorization: The repository owner asked for direct commits on main and a push to the remote, so no pull request is opened; each repository item records its pushed head and its hosted CI.
repositories:
  - id: ratatoskr-workspace
    role: reusable-publishing-workflow-then-playbook-harness-and-pins
    branch: main
  - id: ratatoskr-platform
    role: export-stage-and-publishing-caller
    branch: main
  - id: ratatoskr-extractor
    role: dockerfile-arm64-smoke-and-publishing-caller
    branch: main
  - id: ratatoskr-telegram
    role: dockerfile-arm64-smoke-and-publishing-caller
    branch: main
dependency_order:
  - ratatoskr-workspace  # the reusable workflow only, which the callers pin by SHA
  - ratatoskr-platform   # owns ratatoskr.target and the schema
  - [ratatoskr-extractor, ratatoskr-telegram]
  - ratatoskr-workspace  # pins, playbook, Molecule, harness checks, documentation
contracts:
  shared_documents: none
  change: none
compatibility:
  strategy: Additive. The manual runbooks stay valid; the playbook performs the same steps in the same order. A repository that ships no unit is not affected.
database:
  strategy: none; the playbook runs the checked-in SQL files as written, in the order postgres-provisioning fixes.
  migration_artifacts: none
api:
  version: 1
  negotiation: none
  breaking_change: none
runtime:
  supervision: systemd units and ratatoskr.target, unchanged (Platform ADR-0013).
  artifacts: ghcr.io/po4yka/<repository>:sha-<commit>, OCI artifact type application/vnd.ratatoskr.binaries.v1, with SHA256SUMS, an SPDX SBOM and a build-provenance attestation.
security:
  secrets: Generated on the host and never transmitted (database passwords, nkey seeds, the Telegram assertion key); operator-supplied secrets come from an ansible-vault file outside the repository.
  verification: The controller verifies the attestation and the checksums before a binary reaches the host; the host needs no registry access.
  freeze: The playbook refuses the real host while docs/DEPLOYMENT_TARGET.md states that the host is frozen.
privacy: No personal data is touched.
rollout:
  - Publish the reusable workflow from ratatoskr-workspace.
  - Platform, then the extractor and Telegram, call it; each publishes its first artifact on its next push to main.
  - Advance the workspace pins to those commits, then land the playbook, Molecule, the harness checks and the documentation.
  - The real host is not touched until the owner lifts the freeze.
rollback:
  - Revert each repository's commit. Published artifacts stay and harm nothing; the manual runbooks remain correct.
verification:
  - harness tests release_artifact_check.rs, release_artifact_callers.rs and deploy_inventory.rs
  - the release-artifact-selftest job in ratatoskr-workspace CI
  - each service repository's linux/arm64 artifact job and its first published, attested artifact
  - the Molecule scenario on a native arm64 runner (converge, idempotence, verify)
evidence:
  platform_commit: ec2251b845a17a60b23dab8fc130338600dff78f
  extractor_commit: dcc85b7b63d94509bd9f011d78a2fccec895037d
  telegram_commit: 0b61997a2d5e6b0fa3797789019f7ddfdfac84d3
  children_hosted_ci: green, with linux/arm64 artifact and release-artifact on each
  platform_artifact_attestation: verified with gh attestation verify --signer-workflow
  workspace_pins_commit: f34882a078ed74ea557ccb44419c7486a1ce1911
  workspace_playbook_commit: ff8bc640fbd1eb8c54367883765ef499aa17a98f
  workspace_fix_commits:
    - 2fd759709a0126a028c84a3135e85e26eb65b592  # CI installs ansible.posix for the Molecule create step
    - 9094f8bdef7364b6ebde4d5d3550127932b26fee  # the converge leaves ratatoskr.target active
  workspace_hosted_ci: green
  workspace_runs:
    workspace_snapshot: https://github.com/po4yka/ratatoskr-workspace/actions/runs/38404215415
    fleet: https://github.com/po4yka/ratatoskr-workspace/actions/runs/38404215208
    openspec: https://github.com/po4yka/ratatoskr-workspace/actions/runs/38404215542
    zizmor: https://github.com/po4yka/ratatoskr-workspace/actions/runs/38404215460
  molecule: green on ubuntu-24.04-arm (create, converge, idempotence with zero changes, verify)
  required_checks_added: [molecule, release-artifact-selftest / artifact]
  required_checks_open: linux/arm64 artifact is not yet required in ratatoskr-extractor and ratatoskr-telegram
  test_first_order: not kept for groups 6 to 9; tasks.md records it per task
live_deployment: not_authorized_target_frozen
