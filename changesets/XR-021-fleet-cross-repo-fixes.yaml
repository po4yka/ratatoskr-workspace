  harness_findings_of_the_first_run:
    - "The first honest run could not start: the interpreter choice, q swallowing psql errors (an assertion over two empty strings passed), the removed knowledge.ingest_failures table."
    - "Stale state between flows: logs and the control files of the fakes (fake-fail, github-description, deleted.list) survived a flow and changed the first answer of a fake."
    - "A fake whose control was an empty file read as unset (github-stall), and secret() stripped base64 characters and so produced fewer than the 32 characters conf_github demands in most runs."
    - "Assertions written against behaviour the services no longer have or never had: Knowledge readiness that 'stays 200' while the broker is down, a removal fact for a post the owner never preserved, a terminal unavailable within 150 s for a transport failure that X retries for about 40 minutes, a wrong-length blob log class, a track action that reports a provider failure in a 200 body."
    - "Fixtures: one-line PDFs are judged to have no text layer, a 9 MB-text PDF exceeded the page cap before the event limit, the GitHub fake had no usable /user, the F4 worker started before the API had applied the schema, and the tap buffered the dispatcher's text/event-stream response."
    - "The series-3 NOT RUN of the old F6 was a lookup of an export that no longer existed: the Civet conversation deletion removes it, since Civet is only in export 3. It was not fixture non-determinism: archives.py builds byte-identical files (a self-test builds twice) and the digest is now recorded at upload in $S/fx/<name>.sha256."
  amended_residual_risks:
    removed:
      - "Abandoned AI-archive staging leaking until the volume fills (R5-04). Evidence: the reaper legs of F1 (abandoned, expired, digest-mismatch, orphan) and the Platform tests; no RED run against platform 1624d03."
      - "An Export Agent wedged on a dead resumption token (R5-05). Evidence: the Swift tests of ratatoskr-export-agent and the F1 dead-token leg with the Python driver; the Swift client against live Edge was not run."
      - "Duplicate library documents for one PDF (R5-02). Evidence: F2 and F3 (one document for two captures of one digest); the same PDF fetched by URL was not run; no RED run against extractor b44ba81 and knowledge 4bf28dd."
      - "A conversation above 1 MiB failing the snapshot store and being Termed unanalysable (R5-03). Evidence: F2 (2 MiB and 7.9 MB conversations of both providers searchable); no RED run against knowledge 4bf28dd."
      - "Deletion owner after a mapping change (R5-06). Evidence: F6 for both providers; the two-owners-for-one-account leg was not run; no RED run against claude 6f27d83."
      - "A tombstone lost without a resend (R5-11). Evidence: F6 (resend after 150 s, one acknowledgement, no further resend); no RED run against chatgpt 78b3dfa."
      - "Deleted AI-archive content surviving in the events stream (R5-12). Evidence: F6 (the deleted conversation's fact message gone within 30 s, the neighbour kept, an audit row without content); no RED run against chatgpt 78b3dfa."
      - "A provider key rejected, credit exhausted or a model withdrawn poisoning a run permanently (R5-08). Evidence: F2 credential outage (401, 402, 404, then 200); no RED run against knowledge 4bf28dd."
      - "The Telegram progress stream reconnecting about every 12 s (R5-10). Evidence: F3 (at most two follow requests over 32 s); no RED run against telegram 04c25a5."
    kept:
      - "The events stream drops its oldest messages at 7 days or 1 GiB (the owner's accepted policy) for non-deletion facts; R5-13 makes the lag visible and R5-11 protects deletion facts, but a repository-analysis request or an ingest fact that Knowledge does not consume in time is still lost."
      - "Instagram's response classification is a starting point to correct against recorded live fixtures; X and Meta credentials are external dependencies."
      - "The host prerequisites: the ratatoskr-telegram-blobs group and the thirteen nkeys do not exist yet, and Knowledge's role file must be run by a PostgreSQL administrator because pgvector is not a trusted extension."
      - "Knowledge's /ready latches storage readiness at startup; ingest redelivers during a database outage, so no fact is lost."
      - "X can still read the operation-report metadata of every tenant through ratatoskr_x_extractor_reports."
    added:
      - "Social facts stay in ratatoskr_events after an Instagram, Threads or X privacy deletion until retention drops them (R5-12 erases only the AI-archive facts)."
      - "The five producers read every acknowledgement's metadata (ids, tenant references and a subject reference, no content) on their own durable."
      - "A compromised ChatGPT or Claude identity can still publish forged facts, and can ask Edge to erase only messages that carry its own producer name and the tenant it names."
      - "The Round 5 native legs were not run against the Round 4 heads, so a leg is not shown to fail without its fix (OpenSpec task 6.2)."
      - "The alert rule file is evaluated by an engine the owner has not chosen, and RatatoskrUnacknowledgedTombstones stays silent until the producers' operator ports are opened to the monitoring bridge."
