id: XR-021
state: pins-landed-integration-incomplete
goal: Fix the cross-repository defects of the Ratatoskr fleet at the boundaries between repositories (bus subjects and envelopes, outbox relays, NATS permissions, port collisions, the AI archive upload binding, the channel-digest chain, explicit social captures, the content capture command and Telegram blob captures, privacy deletion), record the resulting behaviour in the workspace spec store, and pin a compatible snapshot.
non_goals:
  - "Production host provisioning: nkeys, the ratatoskr-telegram-blobs group, external provider credentials (listed under rollout for the operator)."
  - "Per-producer operation-report subjects and a GitHub re-queue sweep for dropped repository analysis requests (follow-ups, recorded under residual_risks). Oversized documents and archive facts were a follow-up in round 1 and are handled in round 2 by the 8 MiB broker limit and the enqueue-time size guards."
  - "Image capture in Telegram: refused truthfully and tracked as a refusal-only issue."
  - "Converting docs/REQUIREMENTS.md or its siblings into specs; release tags; any edit under repos/."
