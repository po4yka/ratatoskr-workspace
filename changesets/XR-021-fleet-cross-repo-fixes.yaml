  native_smoke:
    note: "The eight flows were run through integration/native/run.sh as committed (workspace commit 4d95fa7; only README.md changed afterwards, in 9dd4dcb), one at a time, by an earlier writer of this round on the developer's Mac (macOS 27, arm64, nats-server 2.15.1, PostgreSQL 17 with pgvector, Python 3.12.15 chosen by py_select, 140 GiB free), with RATATOSKR_SMOKE_REF=origin/main: each flow exported the origin/main of the repositories it uses into the state directory with git archive and built them with the shipped release profile. Those commits are the Round 5 pins recorded in this block, and the baseline submodules stayed clean. The order was F0, F1, F6, F2, F3, F4, F5, F7 (F6 right after F1, which keeps the data F6 needs). The evidence summaries are in the gitignored evidence/XR-021-r5/<flow>/ (asserts.txt, result.txt). Results are copied from what each run reported; nothing is upgraded. RED evidence against the Round 4 heads was NOT collected for any leg (OpenSpec task 6.2 stays open)."
