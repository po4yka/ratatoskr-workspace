  breaks:
    - "Extractor: extraction_runs.document_id and QueuedRun.document_id are removed and the document identifier is derived from the owner and the content digest (stable_document_id); assemble_document takes the owner, not an identifier, and every parser input struct carries the owner. A database is recreated from the edited schema."
    - "Knowledge: RATATOSKR__LIMITS__BLOB_BYTES below 8388608 or below raw_response_bytes refuses to start (the blob store no longer takes the smaller of the two limits); schema.sql gains the partial unique index source_refs_document_digest_key on extractor sources; ProviderError gains OperatorAction and the failure classes payment_required and model_unavailable (the three failure_class CHECK lists); the head of an analysis moves on an equal observed_at with a later event id; knowledge.event_outbox gains the subject knowledge.deletion.acknowledged.v1."
    - "Platform: five new durables (ratatoskr_{chatgpt,claude,x,instagram,threads}_deletion_acks) and the Edge-internal platform_stream_erasure, ACL lines for the five producers, KNOWLEDGE (publish evt.knowledge.deletion.acknowledged.v1) and CHATGPT and CLAUDE (publish cmd.platform.stream_erasure.requested.v1), the key RATATOSKR__ARCHIVE_STAGING__SWEEP_INTERVAL_SECONDS (rule V23, 30 to 3600), open replacing a dead upload session with a 201, and a command consumer for stream erasure. NATS must be reloaded with the new ratatoskr.conf before Edge starts."
    - "ChatGPT and Claude: the announced_subjects ledger, the removal of the live-mapping deletion path (Claude's plan no longer refuses an account that left PLATFORM_ACCOUNTS; ChatGPT's FACT_OWNER scraping is deleted), the outbox columns acknowledged_at, ack_outcome, resend_count, next_resend_at and published_stream_seq, the keys RATATOSKR__TOMBSTONE__RESEND_AFTER_SECONDS and RESEND_CAP_SECONDS, the stream erasure command, and the durable they must find at startup."
    - "X, Instagram and Threads: outbox columns for the removal fact, a consumer of the acknowledgement durable, the same resend keys, and a deletion path that no longer removes an unacknowledged removal row."
    - "Instagram: the content digest preimage changes (SHA-256 over the canonical JSON of the snapshot content; no constant digest remains) and an updated fact carries the resolution time of the current revision."
    - "channel-digests: the warning text of channel_digest.acquisition_incomplete changes, a digest selects the newest source_count posts, and the worker accepts the strict keys RATATOSKR__RETENTION__BODY_DAYS and RATATOSKR__RETENTION__SWEEP_INTERVAL_SECONDS."
    - "Export Agent: the upload journal format changes (a reopen counter and the retries_exhausted reason are stored in the checkpoint)."
    - "Telegram: the Platform client gains a second HTTP client for the progress stream (connect timeout, 45 s read timeout, no total timeout)."
    - "Workspace: the native harness state directory and evidence root are XR-021-r5, one interpreter is chosen by a probe, and RATATOSKR_SMOKE_REF runs a flow against a ref of each repository. The development status applies to every item: one version, no migration, databases recreated from the edited schema definitions."
  exclusions:
    - item: "Platform emitting evt.platform.notification.raised.v1"
      reason: "a product decision; nothing in the fleet raises a notification (R4-11 documents it)"
    - item: "The fleet-wide account-erasure transport (identity.account.erasure_requested consumers and acknowledgements in every service, GitHub's erase_account included)"
      reason: "a feature of its own, which is also why GitHub is not a producer of R5-11"
    - item: "Image OCR in Telegram"
      reason: "refusal-only by design, issue 16"
    - item: "Live calls to real X, Meta, Threads, OpenRouter and Telegram MTProto services, including Instagram's classify_response calibration and the success legs of Instagram and Threads public resolution"
      reason: "credentials are needed and the endpoints are allow-listed to Meta hosts on purpose"
    - item: "Pre-existing items unrelated to the seven flows"
      reason: "each accepted or a contract change, as listed in R5-15 (3) to (5)"
    - item: "Ports and listeners (R5-01)"
      reason: "decision A confirmed a fourth time: services bind the ports Edge routes to; no S05 row changes and docs/DEPLOYMENT_TARGET.md is unchanged"
    - item: "What a native smoke cannot show (R5-15 (6))"
      reason: "real MTProto acquisition, Telegram webhook delivery by Telegram, the macOS keychain pairing and the Swift agent against live Edge, TLS through cloudflared, systemd sandboxing and the group permissions of the Telegram blob root, container reachability of NATS, the Raspberry Pi glibc and page-size behaviour and the 2 GiB timing on the Pi; they stay NOT RUN"
  open_lows:
    - "Platform prepare answers 404 for a receiver that is not yet observed (accepted edge-gateway spec; a 503 with Retry-After is the clearer boundary)."
    - "Platform finalize_transfer has no per-token lock: a client retry during assembly can corrupt the assembled copy, and the receiver's digest check then refuses it permanently."
    - "The 300 s request and header budgets are unmeasured for a 2 GiB archive on the Raspberry Pi."
    - "The agent's fixed 1 MiB chunk cannot carry an archive between about 9.77 GiB and 10 GiB (the shipped 2 GiB default is unaffected)."
    - "The macOS 14 floor for .iso8601 with fractional seconds is untested."
    - "Claude's late report for a duplicate upload can disagree with the original (load_summary hard-codes too_large = false)."
    - "docs/fleet-map.html in the workspace still names the old receiver ports and methods."
    - "The ChatGPT and Claude receivers connect to NATS lazily at the first outbox row, so a bad seed or ACL is not visible in /health/ready."
    - "Only Platform has a '## Deployment target' section although the workspace AGENTS.md asks every repository for one; chatgpt and claude ship no systemd unit or tmpfiles entry."
    - "Knowledge late object facts: record_object ignores tombstone_blocks, so a retried archive.imported, artifact.added or artifact.updated after the tombstone re-inserts an ai_archive_object_inbox row."
    - "Claude's outbox_privacy_tombstone_once suppresses a second tombstone for a reused artifact id; ChatGPT tombstone_subject has no fallback for a conversation without an export observation."
    - "A Telegram blob_root default that differs from the extractor's telegram_root; the Bot API file download shares the 10 s whole-call timeout (an 18 MiB PDF needs about 14 Mbit/s); Telegram's classify() maps a Platform 403 to Unauthenticated."
    - "The dead LIMITS__* keys and unused columns of channel-digests; supervise_provider reconnecting every second without backoff and execute_one not being interrupted by shutdown."
    - "A permanently invalid social command leaves its operation unreported until the stale reaper."
    - "The GitHub re-queue sweep (a repository analysis that ended in a terminal failed fact, or a request lost to stream retention, is re-requested only when the repository's metadata changes) and the GitHub idempotency-digest conflict that is rejected without a failed fact."
    - "Social facts (social.source.captured|updated.v1) stay in ratatoskr_events after an Instagram, Threads or X privacy deletion until retention drops them (R5-12 covers the AI-archive facts; the mechanism is generic and can be extended)."
  accepted_design_limits:
    - "A scheduled digest run that fails leaves no result and no operation."
    - "The channel-digests subscription report does not verify that the channel exists."
    - "Platform's cancel route accepts channel_digest.* operations that channel-digests never consumes."
    - "The late detection of an unmapped user at prepare (needs a capabilities shape change)."
    - "The missing pagination cursors of GET /v1/subscriptions and GET /v1/results."
  workspace_changes:
    openspec: "openspec/changes/xr-021-fleet-round-5 (nine capability deltas); xr-021-fleet-round-3 and xr-021-fleet-round-4 archived (openspec/changes/archive/2026-10-13-xr-021-fleet-round-3 and -4) and their deltas folded into openspec/specs"
    docs: "docs/QUALITY_GATES.md (the four new checks, the two changed, what each cannot see, and what the Round 5 run of the native harness does and does not show), integration/native/README.md (per flow: run through run.sh as committed, with the assertion count, and what each flow could not show)"
    harness_tests:
      - "harness/crates/workspace-core/tests/bus_durables.rs (23 service durables, the five deletion_acks rows resolved through DELETION_ACKNOWLEDGED_SUBJECT, platform_stream_erasure, the declared length of DOMAIN_CONSUMERS, two tests of the new matcher)"
      - "harness/crates/workspace-core/tests/bus_acl.rs (27 durable owners, the three publish rights, invariant 7 with the KV stream info allowed, the stanza reader moved to support/acl.rs)"
      - "harness/crates/workspace-core/tests/tombstone_acks.rs (new)"
      - "harness/crates/workspace-core/tests/alert_rules.rs (new)"
      - "harness/crates/workspace-core/tests/base_urls.rs (new)"
      - "harness/crates/workspace-core/tests/support/acl.rs (new, shared by bus_acl.rs and tombstone_acks.rs)"
      - "harness/crates/workspace-cli/tests/committed_snapshot.rs (EXPECTED_PINS advanced to the Round 5 heads)"
