  native_smoke:
    note: The smoke runs were performed by other agents before this record was written; their results are copied as reported to the workspace writer. Nothing is upgraded. Five of the seven planned flows have no result in what was reported (F2, F3, F5, F6, F7) and are recorded as not reported, not as run or passed. No smoke script is committed.
    flows:
      - flow: F1 AI-archive upload (export-agent style HTTP calls to Platform Edge, then the ChatGPT and Claude receipt, then the operation reported back)
        ran: true
        passed: false
        blocker: "Edge's startup validation hard-codes the production ports for its upstreams, so with the ports remapped into 57900..57999 ratatoskr-edge refused to start with 8 configuration problems (7 gateway route listeners and the channel-digests listener, V22). Edge ran with no gateway routes. The public prepare, open, chunk PUT and finalize hops and Edge's gateway forward to the receivers were therefore never exercised by a real Edge."
        faked_hop: "Edge's prepare and gateway forward were replaced by an emulator that inserted the rows Edge's accept() writes and then POSTed to the receiver with Edge's six x-ratatoskr-* claims and no Authorization header. Everything after that was real: the receiver, its outbox, its publish under the deployed ACL, and Edge's projection."
        passed_assertions:
          - "ChatGPT and Claude start from their shipped examples and report ready; GET /v1/capabilities on the receipt ports returns the ai_archive.receipt capability; /metrics is 404 on the receipt ports and 200 on the operator ports; the receipt path and /v1/capabilities are 404 on the operator ports"
          - "Edge with no routes: /health/ready 200; 3 streams and 26 durables present; all 18 domain consumers present with the right filters, ack waits and max_deliver"
          - "Real device pairing through real Edge (pairing code 201, pair 201, device kind export_agent)"
          - "Claude: complete small archive succeeded, complete large archive (5.4 MB zip, one 5 MiB message) succeeded, the shipped fixture succeeded, an archive with reference-only or digest-mismatched knowledge files partially_succeeded with ai_archive.import.incomplete; each reached its terminal state through the real bus and Edge's projection in 1 to 2 seconds"
          - "Negative receipts to both receivers: octet-stream 400 JSON ErrorEnvelope, Authorization present 401, GET 405 with allow: POST; replaying the same bytes under the same operation id returned 202 with unchanged counts"
          - "Edge outage: after SIGKILL of Edge a Claude receipt returned 202, the operation stayed accepted while the projection durable showed pending=1, and after the restart it reached succeeded within 2 seconds"
          - "NATS ACL probes by raw protocol with the real nkeys: all seven denied publishes (ChatGPT and Claude to subjects they may not publish) returned a Permissions Violation, the log holds exactly those 7 Publish Violation lines, and real traffic raised none"
          - "The 5 MiB conversation fact fit under max_payload 8 MiB"
        failed_assertions:
          - "ChatGPT: small, large and fixture archives all ended partially_succeeded with ai_archive.import.incomplete (structurally_partial) and never succeeded; an archive carrying assets.json ended failed with chatgpt.archive.invalid"
          - "Edge's own /v1/capabilities returned services: [] because Edge had no routes"
        not_run: "413 payload_too_large on prepare; a chunk above 2 MiB; resume after an interrupted upload; re-preparing the same bytes returning the same operation; Edge's public capabilities reporting both providers; the export-agent Swift client; the complete-versus-incomplete pair on ChatGPT; Knowledge's consumption of the facts (Knowledge was not part of this flow)"
        ports: "NATS 57910 and 57911, PostgreSQL 57912, Edge 57920 and 57921, ChatGPT 57930 and 57931, Claude 57940 and 57941 (not the production ports)"
      - flow: F4 Channel digests (subscription and run through Platform Edge, bus, channel-digests worker, committed manifest, Knowledge recap with the scripted provider, bus, worker, terminal Edge operation)
        ran: true
        passed: true
        as_reported: "passed true. The transcript handed to the workspace writer ends at leg A step 1. The result line, the NOT RUN / FAKED line and the DEVIATIONS line below come from the flow's own result.txt on disk, and the transcript's setup, build and durable facts are recorded in the lines that follow."
        result_line: "PASS for the Platform Edge to bus to channel-digests worker to Knowledge (scripted) to bus to worker to Edge operation path"
        not_run_or_faked:
          - "NOT RUN: the Edge to channel-digests API read hop (Edge refuses any digests listener except 8098 and any non-allocated route listener, with ports limited to 57900..57999); Edge ran with no domain routes and no channel-digests listener, so the three digest read routes answered 503"
          - "FAKED: MTProto acquisition. The manifest was committed by the service's own DigestCoordinator through a helper from synthetic posts; the provider session file is a locally encrypted file whose only data centre is a closed loopback port"
        deviations:
          - "NATS no_auth_user was mapped to the KNOWLEDGE identity and Knowledge's recap bus credential was removed, because the scripted provider refuses a credentials file. The deployed ACL was therefore not in force for Knowledge on this flow."
        setup_facts: "PostgreSQL 17.11 and nats-server 2.15.1 native, pgvector pre-created by a superuser; release builds with --locked; the NATS file was the deployed one with only port, host, http, store_dir and the 13 nkeys changed; max_payload read back as 8388608; all S04 durables present with the contract values after Edge started; the worker registered its schedule (operations.schedules daily-digest for the owner, schedule.registration audited allowed)"
      - flow: F2 Knowledge ingestion through a PDF blob capture
        ran: not reported
        passed: not reported
      - flow: F3 Telegram to Platform
        ran: not reported
        passed: not reported
      - flow: F5 Social captures
        ran: not reported
        passed: not reported
      - flow: F6 Privacy deletion and tombstone delivery
        ran: not reported
        passed: not reported
      - flow: F7 GitHub repository analysis loop
        ran: not reported
        passed: not reported
    process_incident: "The channel-digests smoke agent ran pkill cargo, which matches by process name for the whole user and may have killed cargo processes belonging to other concurrent agents. The agent flagged it; it is not reversible."
    environment_findings:
      - "A release build with CARGO_PROFILE_RELEASE_DEBUG=0 (the plan's setting) fails on this host (macOS 27.0.1, ld 27037.1, rustc 1.97.0): rustc cannot dlopen the sqlx-macros proc-macro dylib, 'mis-aligned LINKEDIT string pool'. The default build passes; the channel-digests agent worked around it with CARGO_PROFILE_RELEASE_STRIP=none."
      - "The plan's jetstream.max_file_store override of 2GB makes Edge fail at startup with 'insufficient storage resources available'; the deployed 8GB works. The rendering library keeps 8GB."
      - nk, nsc and the nats CLI are not installed; nkeys were generated by a script using the nkeys encoding and the cryptography package in place of nk -gen user -pubout.
      - "ratatoskr_chatgpt and ratatoskr_claude were created by hand as nosuperuser roles with connect and create on the database."
    what_it_cannot_show: Real MTProto acquisition, live X, Meta, Threads and OpenRouter responses, the Export Agent's macOS keychain pairing, TLS termination by cloudflared, systemd sandboxing and the host's group permissions on the Telegram blob root, anything that needs more than single-machine loopback, and process restart behaviour except where a flow killed a process on purpose.
  remaining_defects:
    - "platform crates/core/src/config/validate.rs lines 196-199 and 316-319: gateway route listeners must equal the production port (8091 to 8097) and the channel-digests listener must be 8098 on loopback, so no isolated port range can run Edge with routes. Either allow a configurable allowed-port policy or document it."
    - "workspace .omc/plans/XR-021/round2/workspace.md (local plan): the jetstream.max_file_store 2GB override and the CARGO_PROFILE_RELEASE_DEBUG=0 build setting are wrong on this host (see environment_findings). Not committed; the rendering library follows the findings."
    - "chatgpt crates/chatgpt-archive/src/initial_import.rs lines 441-446 with synthetic_parser/mod.rs lines 105-109 and the gap_entries == 0 completeness rule (about line 474): a ChatGPT import cannot reach succeeded, and an archive with assets.json ends failed."
    - "chatgpt initial_import.rs failure path (about lines 365-385, receipt::report::failed): a failed import and the 400, 401 and 405 receipt refusals log nothing, while Claude logs each refusal with its class, so an operator cannot diagnose a failed ChatGPT import."
    - "chatgpt receipt/outbox.rs lines 70-72 and claude operation_outbox.rs lines 96-97: publish_pending_once opens a new NATS connection on every pump pass (about every 2 seconds, even with an empty outbox); 407 connect and close pairs in about 13 minutes from ChatGPT alone."
    - "chatgpt deploy/systemd/chatgpt.conf.example line 10 and claude claude.conf.example line 10 point at roles ratatoskr_chatgpt and ratatoskr_claude on database ratatoskr, but platform/deploy/postgres/01-database-and-roles.sql creates only the edge, ingest and scheduler roles and revokes connect from public; no repository documents or creates the two importer roles."
    - "claude claude.conf.example line 31 and its receipt authentication: a user in PLATFORM_ACCOUNTS whose archive account row does not exist gets 401 claude.auth.unauthenticated, while ChatGPT creates the account on first receipt; the two importers disagree and Edge's client sees an auth failure for a seeding problem."
    - "chatgpt GET /v1/capabilities omits cache-control: no-store while claude's sends it (a small inconsistency)."
round_3:
  goal: "Fix the defects that the Round 2 native smokes and the independent verifiers found and that were re-verified against current origin/main: per-service NATS inbox prefixes, the dispatch lane recorded on an operation, a refused archive delivery that ends its operation and an upstream 401 that never reaches a device, account rows created on the first receipt, ChatGPT completeness and survivors of a deleted export, one connection and event-id message names in the importers, Knowledge tombstones that are never dead-lettered and an index that holds text and no scaffold, channel-digests partial acquisition, queued runs and logging, one PostgreSQL database with a role file per service, an assertion-key command, Edge readiness, the extractor blob claim, the social permalink grammar and the X trust anchor, one contracts revision; record the behaviour as an OpenSpec change, add the harness checks that stop the drift, put the last Docker profile under the deployed ACL, write the native smoke harness, and advance the pins."
  contract_source: ".omc/plans/XR-021/CONTRACTS.md sections R3-01 to R3-20 (a local planning file, not committed). CONTRACTS_SHA stays ad16855c4e7f3d52cd118274faa3b8f3ab4da576 for every repository; chatgpt and claude return to it from 5426cf3 (R3-16). The contracts repository receives no round 3 commit and the workspace keeps pinning its round 2 head."
  openspec: "openspec/changes/xr-021-fleet-round-3 (NOT archived: task 1.7 (x is not green), task 5.2 (no committed native flow has been run through run.sh) and task 9.1 are open; xr-021-fleet-cross-repo-fixes and xr-021-fleet-round-2 were archived in that order once their tasks were ticked)"
  hosted_ci_of_pinned_heads: "read through the GitHub API on 2026-10-12: every check run concluded success on platform 6, extractor 6, knowledge 5, channel-digests 5, github 6, vault 5, instagram 5, threads 5, chatgpt 5, claude 5, telegram 5, export-agent 4 and browser-extension 4 (a separate Dependabot Updates workflow run on the browser-extension head failed, which is not a check of the code); x concluded 4 of 5: fleet / invariants FAILED on 4a32e8ea because the fleet scan for committed private keys matches crates/x-core/tests/config.rs. That red check is recorded as a defect of ratatoskr-x and is not hidden; this repository does not edit it."
