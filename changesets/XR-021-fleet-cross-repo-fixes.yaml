compatibility:
  strategy: Expand in contracts first; every wave-2 repository depends only on that SHA and on local fakes; the workspace pins the verified set last. Development status applies, so there is one version, no negotiation and no migration.
  hard_breaks:
    - content.capture.requested.v1 moves from Platform's flat command document to the typed CommandEnvelope in Platform, the extractor and X together; interleaved old and new binaries terminate capture commands on decode, so they merge and deploy together
    - "operator listener defaults move: extractor 9467 to 9088, X 8080 to 9087, ChatGPT 9084 to 9085, Claude 9084 to 9086"
    - ChatGPT and Claude FinalizationFault, PrivacyDeletionService and Claude PrivacyDeletionExecutor::finalize signatures change
    - Knowledge DeletionReceipt.orphan_digests_removed is renamed recovered_digests_removed and the job output orphan_blobs= becomes recovered_blobs=
    - X ExplicitCaptureService is deleted; Instagram stops publishing to a log
    - X, Instagram, Threads and Knowledge ingest refuse to start with a bus configured and no resolution surface or credentials
    - the extractor's wide NATS permission file is deleted in favour of narrow stanzas in one reviewed file
database:
  strategy: Edit each current schema.sql in place (platform, extractor, knowledge, channel-digests, github, x, instagram, threads, chatgpt, claude) and recreate development databases from them.
  migration_artifacts: none
