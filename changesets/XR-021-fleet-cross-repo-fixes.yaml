      - "Platform's Edge validates its route listeners against the production ports: now a recorded decision (R3-17), not a risk. A smoke that needs Edge routes runs on the production loopback ports."
    kept:
      - "X can still read the operation-report metadata of every tenant through ratatoskr_x_extractor_reports, and evt.platform.operation.reported.v1 is still one subject trusted by its envelope producer (per-producer subjects need a contract change)."
      - "The events stream drops its oldest messages when full (1 GiB or 7 days), so a very deep backlog could drop a repository-analysis request that GitHub already marked published; a GitHub re-queue sweep and a consumer-lag alert are follow-ups for the owner."
      - "GitHub's revocation probe note: a 404 on DELETE /applications/{client_id}/grant is accepted as already revoked only after GET /user with the same token answers 401."
      - "Instagram's response classification is a starting point to correct against recorded live fixtures; X and Meta credentials are external dependencies."
      - "The Telegram blob store is content-addressed and deduplicated across users; the guard on POST /v1/captures/blobs is the Telegram session kind, the owner allow-list and the unguessable digest."
      - "The host prerequisites: the ratatoskr-telegram-blobs group and the thirteen nkeys do not exist yet, and Knowledge's role file must be run by a PostgreSQL administrator because pgvector is not a trusted extension."
    added:
      - "The committed native smoke harness has not been run through run.sh, so none of its flows is evidence yet; the Round 3 smoke results come from by-hand scripts outside this repository."
      - "ratatoskr-x at 4a32e8ea has a red fleet / invariants check (the fleet private-key scan matches a test fixture); the pin is recorded as it is."
      - "A Claude archive that carries any project knowledge file cannot reach succeeded through the real receipt path (see remaining_defects)."
  remaining_defects:
    - "claude crates/claude-archive/src/initial_import.rs:232 (reported by the F1 smoke): the receipt import calls ArchiveCompletenessReport::from_ingest(archive_id, &parsed, &[]) with an EMPTY outcomes slice, and nothing in production code calls ProjectKnowledgeIngestor::ingest (crates/claude-archive/src/project_knowledge.rs:71; the only callers are tests, and lib.rs:86 re-exports it). Every project knowledge file therefore counts as knowledge_file_missing_bytes even when the archive carries the bytes inline with a matching sha256 (crates/claude-archive/src/completeness.rs:118-121). Observed: a Claude archive with one knowledge file with correct bytes and sha256 ends partially_succeeded, completeness assets_partial, gap_count 1 (operation 01a12cc2-76a1-7fe3-a46d-30969ba43bdc). A Claude archive that contains any knowledge file can never reach succeeded; an archive with none does. Severity medium: the positive capability is only half wired."
    - "chatgpt schema.sql:313-319 and schema.sql:343-346 (also schema.sql:75-76), reported by the F1 smoke: migration-style ALTER TABLE ... ADD COLUMN IF NOT EXISTS statements follow the CREATE TABLE in the one current schema definition, against the 'no migrations, edit the schema in place' development status. On a fresh database the columns already exist (inbox_events.tenant_id and export_id are in the CREATE TABLE at schema.sql:335-336), so every start logs 42 'column ... already exists, skipping' INFO notices (14 distinct, repeated). Severity low: noise plus dead migration code."
    - "x crates/x-core/tests/config.rs (found by reading the hosted CI of the pinned heads): the fleet / invariants check of ratatoskr-x failed on 4a32e8ea with 'crates/x-core/tests/config.rs contains a private key', the fleet scan for committed PEM private keys matching a fixture added for RATATOSKR__PUBLIC_CAPTURE__EXTRA_CA_FILE. The owning repository has to change the fixture (generate it at run time or use a certificate, not a key); this repository does not edit it."
