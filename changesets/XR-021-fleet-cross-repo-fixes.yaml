workspace_changes:
  openspec: openspec/changes/archive/2026-10-12-xr-021-fleet-cross-repo-fixes (five new capability specs and an added blob-references requirement; archived in round 3, once the workspace commits were published and their hosted CI was green)
  docs: docs/DEPLOYMENT_TARGET.md
  harness_tests:
    - "harness/crates/workspace-core/tests/port_allocation.rs"
    - "harness/crates/workspace-core/tests/bus_acl.rs"
  manifest: workspace.toml gains the vault to github event edge
  manifest_edges_not_added:
    - "knowledge to channel-digests"
    - "platform to channel-digests"
    - "platform to knowledge"
    - "github to knowledge"
  manifest_edges_not_added_reason: each closes a dependency cycle with an existing reverse edge and ws manifest check reports manifest.dependency.cycle for the full set (run on a copy); the runtime couplings are covered by the specs instead
rollout:
  - Install the thirteen public nkeys in ratatoskr.conf (generate the seeds as platform/deploy/nats/README.md says, replace every UREPLACE_ME_* placeholder) and reload NATS; the extractor's old key is replaced by its narrow stanza in the same reload.
  - Restart Edge. It provisions every fixed durable and the browser_worker_completions bucket and refuses to start on a durable that differs from its specification.
  - Start the extractor, the browser worker, Knowledge, channel-digests, GitHub and Vault, then the social services and the AI archive receivers. Deploy Platform Edge last relative to the importers because its receipt forward depends on their envelope and capability behaviour.
  - Create the Telegram blob root and the ratatoskr-telegram-blobs group (install -d -o ratatoskr-telegram-webhook -g ratatoskr-telegram-blobs -m 2750).
  - Set RATATOSKR__SCHEDULE__OWNER_USER_ID for channel-digests to a real user in identity.users so the daily schedule registers.
  - "Provision the external credentials: an X developer app bearer token and a Meta app token. Without them X, Instagram and Threads refuse to start with a bus configured, by design."
  - Merge and deploy Platform, the extractor and X together because of the capture command break.
  - Recreate development databases from the edited schema.sql files.
rollback:
  - Stop the services (reverse of the start order), restore the previous NATS configuration, reload NATS, then restart Edge.
  - "Never delete provisioned durables: their cursors are the only record of what was consumed."
  - Revert the workspace pin commit to return to the previous snapshot. Nothing has shipped from this snapshot and the host is frozen (docs/DEPLOYMENT_TARGET.md), so there is no live deployment to roll back.
required_checks:
  - ./ws manifest check, ./ws lock check, ./ws status, ./ws doctor
  - cd harness and cargo fmt --all -- --check, cargo clippy --workspace --all-targets --all-features --locked -- -D warnings, cargo test --workspace --all-features --locked
  - openspec validate --all --strict and openspec validate --archived
  - each child's own gate before its push
  - integration profile contract tests under integration/tests
issues:
