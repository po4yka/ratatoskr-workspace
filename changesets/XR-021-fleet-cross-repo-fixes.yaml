residual_risks:
  - "evt.platform.operation.reported.v1 is still one shared subject trusted by its envelope producer. Round 3 (R3-02) closes the cross-lane part: Platform records the lane an operation was dispatched to and applies a report only from that producer and the owner's tenant. What stays is that X can still read every tenant's operation-report metadata through ratatoskr_x_extractor_reports (per-producer subjects need a contract change), and that the lane check is proven by the Platform tests, not by a native smoke (flow F5 was not run)."
  - "The events stream drops its oldest messages when full (1 GiB or 7 days), and evt.knowledge.repository_analysis.requested.v1 is an event, so a very deep backlog could drop a request GitHub already marked published (a GitHub re-queue sweep is the recommended follow-up)."
  - "GitHub's REST reference documents only 204 and 422 for DELETE /applications/{client_id}/grant. Round 2 (R2-08) accepts a 404 as already revoked only after a probe of GET /user with the same token answers 401; any other outcome is reported by account erasure as incomplete_external_grant_revocation. The probe, not the undocumented 404, is what makes the revocation verified."
  - "Instagram's response classification is a starting point to correct against recorded live fixtures; X and Meta credentials are external dependencies the owner provisions."
  - "The Telegram blob store is content-addressed and deduplicated across users; the guard on POST /v1/captures/blobs is the Telegram session kind, the owner allow-list and the unguessable digest."
  - "The host group ratatoskr-telegram-blobs and the thirteen nkeys do not exist yet; until they do, extractor blob runs fail with blob_unreadable and no identity can authenticate."
  - "The committed native smoke harness (integration/native) has not been run through run.sh, so none of its flows is evidence yet; the round 3 smoke results in round_3.native_smoke come from by-hand scripts outside this repository, cover F1, F2 and F4 only, and F1 failed one assertion. Superseded in round 5: every flow F0 to F7 was run through run.sh as committed and ended PASS (round_5.native_smoke); the round 3 and round 4 smoke results stay by-hand results."
  - "Round 4 closed the knowledge-file, survivor-content, ingest-redelivery, false-partial-acquisition, Threads-query, Telegram capture-key and ChatGPT tombstone-owner risks of round 3 (see round_4.amended_residual_risks for the evidence of each); the committed native harness had still not been run through run.sh at round 4, and the round 4 smoke results (F1, F2 and F4) come from by-hand scripts. Superseded in round 5: see round_5.amended_residual_risks."
