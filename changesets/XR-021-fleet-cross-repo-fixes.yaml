round_5:
  goal: "Fix the defects rated medium or higher that the Round 4 native smokes and the independent verifiers found and that were re-verified against origin/main on 2026-10-12, add the owner's stream policy, and run the committed native harness end to end for the first time: one document identity per owner and digest (R5-02), Knowledge snapshots up to the broker payload (R5-03), abandoned archive staging removed and a dead upload session replaced (R5-04), the Export Agent classifying Platform answers and bounding its retries (R5-05), every tombstone addressed to the owner the subject was announced under (R5-06), channel-digests taking the newest posts, withdrawing deleted posts and minimising bodies (R5-07), Knowledge waiting out an operator-fixable provider failure and replacing an equal-time head (R5-08), Instagram's digest and observation time describing the post (R5-09), the Telegram progress stream not cut by the whole-call timeout (R5-10), deletion tombstones acknowledged by Knowledge and re-sent until they are (R5-11), deleted content erased from the events stream by Edge (R5-12), consumer lag exported and alerted (R5-13), and the native harness fixed, extended and run (R5-14). Record the behaviour in the spec store, add four harness checks and change two, and advance fourteen pins."
