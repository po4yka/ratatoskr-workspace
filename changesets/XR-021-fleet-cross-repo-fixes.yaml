  breaks:
    - "Claude: schema.sql gains export_observations.content_digest and the entity_versions table, the parsed Conversation and Message types derive Serialize and Deserialize, the production import now ingests project knowledge files (a retryable storage error keeps the run in its state), and a privacy deletion rebuilds surviving projects and conversations from retained versions. A database is recreated from the edited schema (development status: no migration)."
    - "ChatGPT: schema.sql loses seven ALTER TABLE ... ADD COLUMN IF NOT EXISTS statements (the CREATE TABLE statements already declared every column), and the owner of a deletion's tombstones is the owner the archive's own facts named, no longer the live PLATFORM_ACCOUNTS mapping."
    - "Knowledge: the knowledge.ingest_failures table is removed, and a retryable ingest failure of the documents, social and AI-archive families is redelivered without a delivery budget (the repository family keeps its bounded budget); a new counter knowledge_ingest_redeliveries_total is exposed on the operator listener."
    - "Telegram: the capture idempotency key has a new derivation (capture.v2 over sender, route path and the exact request body), a Platform conflict on a capture is a transient class, a rejected Platform credential is dropped and exchanged once, and RATATOSKR__NOTIFICATION_BUS__ACK_WAIT_SECONDS must be exactly 30 (the dispatcher refuses any other value)."
    - "Threads: a permalink with a percent-encoded or non-ASCII query or fragment is accepted (the grammar applies to the authority and the path only); one that was refused is now captured."
    - "channel-digests: acquisition stops at the first page that reaches before the window, so a deep history behind a satisfied window is no longer partial, and a quiet channel with a deep history completes as an empty success instead of failing with channel_digest.provider_unavailable."
