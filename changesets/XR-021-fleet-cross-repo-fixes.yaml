        as_reported: "ran true, passed true, pass=157 fail=0. The 23 service durables including the five *_deletion_acks and platform_stream_erasure were asserted with their filters; every role file ran as written and every role connected unprivileged; the deployed ACL probes (R5-11, R5-12) with the real seeds, the lag series on 127.0.0.1:9464 for a durable nobody consumes, and the alert rule file parsed as YAML."
        faked_or_seeded: "the oversize probe declares a 9 MiB publish and sends the PUB header only; the dispatcher runs only its check-config command (ack wait 31, then 30); the lag leg publishes three probe messages with the ChatGPT identity to evt.ai_archive.archive.imported.v1 that nothing consumes; the ACL probes publish marker payloads and read the broker's log for the violation"
