  breaks:
    - "Knowledge's operator routes (/v1/capabilities, /internal/search, /internal/user-content/*) moved from the operator listener to a new API listener, RATATOSKR__API__LISTEN_ADDRESS, default 127.0.0.1:8091; the operator listener keeps /live, /ready, /metrics and /version on 9081. channel-digests documents Knowledge at 8091."
    - "The ChatGPT receipt and capability routes moved off the operator listener onto a dedicated one, RATATOSKR__RECEIPT__LISTEN_ADDRESS, default 127.0.0.1:8096; the operator listener stays on 9085. Configuration refuses equal addresses."
    - "The extractor outbox no longer dead-letters transient publish failures: it retries forever with a capped backoff and marks only a row that can never be published (larger than the broker's max_payload) undeliverable."
    - "The deployed NATS file sets max_payload: 8MB."
    - "Platform applies an operation report only when the envelope tenant is the operation's owner and the producer is allowed for the operation kind; any publisher that relied on the old behaviour (the TG-010 driver) now reports as the producer it stands in for."
    - Knowledge's channel recap provider mode defaults to openrouter instead of scripted.
  exclusions:
    - item: "Fleet-wide account erasure transport (identity.account.erasure_requested consumers and acknowledgements in every service, including GitHub's)"
      reason: a separate feature of its own
    - item: Image OCR in Telegram
      reason: refusal-only by design, issue 16 filed
    - item: "Live calls to real X, Meta, Threads, OpenRouter and Telegram MTProto services, including Instagram's classify_response calibration"
      reason: they need credentials; the native smoke stops before them
    - item: Domain listeners for vault (8093), social (8094) and ai-archive (8095)
      reason: no implementing service exists; Edge reports their capability stale on purpose
    - item: Wiring Knowledge's social and AI-archive completion facts to Instagram, Threads, ChatGPT and Claude (R2-19), and producing evt.platform.notification.raised.v1
      reason: four more Edge durables and four ACL stanza edits for a feedback link no flow depends on; no producer of the notification exists and what raises one is a product decision
    - item: The browser-extension lockfile registry URLs; the export agent's configurable archive ceiling; the hand-written fixture inside Platform's nats_permissions.rs; per-service authorized-broker tests for X, Instagram, Threads, ChatGPT, Claude and Telegram; the dormant X bookmark and compliance lane; the tombstone owner mapping for unmapped ChatGPT accounts
      reason: CI is green for the first; a permanent-413 rule already makes a mismatch a clean failure for the second; deployed_nats_config.rs covers the third; the Platform matrix plus the NATS server log check cover the deployed ACL for the fourth; no service path syncs bookmarks for the fifth; an unmapped account never reached Knowledge, so the sixth is a configuration dependency
