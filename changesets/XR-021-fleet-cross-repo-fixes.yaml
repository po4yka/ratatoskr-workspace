  breaks:
    - "The inbox prefix: every non-Edge NATS identity may subscribe only to _INBOX_<name>.> and every service sets it with custom_inbox_prefix. A service built before this round, run against the new NATS file, never receives the replies to its JetStream requests and times out. Nothing is deployed (the host is frozen), so the break is named and not staged: reload NATS and deploy the services of one snapshot together."
    - "platform_operations::accept gained a reporter parameter and operations.operations a reporter column (schema.sql edited in place); every mint site passes its lane, and a report from any other producer for that operation is rejected."
    - "A Platform user a receiver does not map is answered 403 <provider>.account.unmapped (it was 401), and Edge answers 502 edge.upstream_invalid_response for any upstream 401 or 407. The export agent treats a 401 as a rejected credential only for Platform's own platform.auth.unauthenticated envelope, and a 403 on the archive routes as permanent."
    - "ChatGPT no longer produces the three gaps projects_not_observed, canvas_not_observed and assets_not_observed; an export with conversations only is complete and its operation succeeded, where it was always partially_succeeded."
    - "Knowledge refuses RATATOSKR__INGEST__ACK_WAIT_SECONDS other than 120 and RATATOSKR__CHANNEL_RECAP__ACK_WAIT_SECONDS other than 30, and indexes an AI conversation as its text (the title, the plain message text and a 280 character lead) instead of the prompt scaffold, so internal ids no longer match a search."
    - "Knowledge's tombstone handling uses a Reject outcome with the closed classes foreign_subject, undecodable and unsupported where a delivery that could never succeed used to burn five deliveries; a transient failure of a tombstone is redelivered at every delivery count and is never written to ingest_failures."
    - "An accepted on-demand digest run is reported queued at stage awaiting_acquisition and running only when acquisition starts; an acquisition that ended with an unavailable or partial channel is no longer an empty success (digest_runs gained acquisition_incomplete)."
    - "The example databases changed: GitHub, Vault, X, Instagram and Threads no longer name their own databases and the development compose port 5435, every example names postgres://ratatoskr_<service>:CHANGE-ME@127.0.0.1:5432/ratatoskr, and Threads moves its raw object root from /var/lib/ratatoskr-threads/raw to /mnt/nvme/ratatoskr/blobs/ratatoskr-threads. The Edge example enables RATATOSKR__IDENTITY__ASSERTION_KEY."
    - "The extractor stores the blob claim (owner, media type, length) on the run and verifies each run against its own command; a failed run reports content.extraction.no_text_layer, encrypted, unsupported_media or source_unavailable instead of one generic code."
    - "The browser extension routes only the permalinks the provider lane accepts (X ids of at most 19 digits, Threads handles of at most 30 characters); X gains RATATOSKR__PUBLIC_CAPTURE__EXTRA_CA_FILE and a finished capture no longer carries a future next_attempt_at."
    - "ChatGPT and Claude pin the contracts at ad16855 again (no crate source differs from 5426cf3 and no wire shape changed), refreshing their Cargo.lock."
