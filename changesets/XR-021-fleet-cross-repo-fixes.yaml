dependency_order:
  - ratatoskr-contracts
  - [ratatoskr-platform, ratatoskr-extractor, ratatoskr-knowledge, ratatoskr-channel-digests, ratatoskr-github, ratatoskr-vault, ratatoskr-x, ratatoskr-instagram, ratatoskr-threads, ratatoskr-chatgpt, ratatoskr-claude, ratatoskr-telegram, ratatoskr-browser-extension, ratatoskr-export-agent]
  - ratatoskr-workspace
contracts:
  contracts_sha: ad16855c4e7f3d52cd118274faa3b8f3ab4da576
  change: additive only; no existing wire shape changes
  new_or_extended:
    - "OperationReported::validate"
    - "ai_archive_contracts::platform_receipt"
    - "AiConversation::compute_content_digest and verify_content_digest"
    - "channel_digest.manifest"
    - "channel_digest.subscription_view"
    - "channel_digest.result_view"
    - "platform.schedule_registration_requested"
    - "content.capture_requested"
    - "content.document_extracted"
    - "backup.policy_apply_requested"
    - "social_contracts::capture_report"
    - "canonical captured_at fixtures"
    - "operation_reported producers list and a summary text correction"
  binding: every ratatoskr-* git dependency of every wave-2 repository names this one SHA
  not_pinned: contracts origin/main is one commit ahead (a1f43aaf52e86b5af3400e56950aa43563bfa872, a CI action version bump); the snapshot pins the SHA every child builds against
compatibility:
  strategy: Expand in contracts first; every wave-2 repository depends only on that SHA and on local fakes; the workspace pins the verified set last. Development status applies, so there is one version, no negotiation and no migration.
  hard_breaks:
    - content.capture.requested.v1 moves from Platform's flat command document to the typed CommandEnvelope in Platform, the extractor and X together; interleaved old and new binaries terminate capture commands on decode, so they merge and deploy together
    - "operator listener defaults move: extractor 9467 to 9088, X 8080 to 9087, ChatGPT 9084 to 9085, Claude 9084 to 9086"
    - ChatGPT and Claude FinalizationFault, PrivacyDeletionService and Claude PrivacyDeletionExecutor::finalize signatures change
    - Knowledge DeletionReceipt.orphan_digests_removed is renamed recovered_digests_removed and the job output orphan_blobs= becomes recovered_blobs=
    - X ExplicitCaptureService is deleted; Instagram stops publishing to a log
    - X, Instagram, Threads and Knowledge ingest refuse to start with a bus configured and no resolution surface or credentials
    - the extractor's wide NATS permission file is deleted in favour of narrow stanzas in one reviewed file
database:
  strategy: Edit each current schema.sql in place (platform, extractor, knowledge, channel-digests, github, x, instagram, threads, chatgpt, claude) and recreate development databases from them.
  migration_artifacts: none
api:
  version: 1
  negotiation: none
  generated_surface: ratatoskr-platform/openapi/openapi.json (new channel-digest routes and POST /v1/captures/blobs; POST /v1/captures unchanged so generated clients do not drift)
runtime:
  ports: docs/DEPLOYMENT_TARGET.md is the complete table; port_allocation.rs enforces it
  bus: thirteen nkey identities in platform/deploy/nats/ratatoskr.conf; bus_acl.rs enforces the copies
  telegram_blob_root: /mnt/nvme/ratatoskr/blobs/ratatoskr-telegram, read group ratatoskr-telegram-blobs, read-only for the extractor
workspace_changes:
  openspec: openspec/changes/xr-021-fleet-cross-repo-fixes (five new capability specs and an added blob-references requirement; not archived until the workspace commits are published)
  docs: docs/DEPLOYMENT_TARGET.md
  harness_tests:
    - "harness/crates/workspace-core/tests/port_allocation.rs"
    - "harness/crates/workspace-core/tests/bus_acl.rs"
  manifest: workspace.toml gains the vault to github event edge
  manifest_edges_not_added:
    - "knowledge to channel-digests"
    - "platform to channel-digests"
    - "platform to knowledge"
    - "github to knowledge"
  manifest_edges_not_added_reason: each closes a dependency cycle with an existing reverse edge and ws manifest check reports manifest.dependency.cycle for the full set (run on a copy); the runtime couplings are covered by the specs instead
rollout:
  - Install the thirteen public nkeys in ratatoskr.conf (generate the seeds as platform/deploy/nats/README.md says, replace every UREPLACE_ME_* placeholder) and reload NATS; the extractor's old key is replaced by its narrow stanza in the same reload.
  - Restart Edge. It provisions every fixed durable and the browser_worker_completions bucket and refuses to start on a durable that differs from its specification.
  - Start the extractor, the browser worker, Knowledge, channel-digests, GitHub and Vault, then the social services and the AI archive receivers. Deploy Platform Edge last relative to the importers because its receipt forward depends on their envelope and capability behaviour.
  - Create the Telegram blob root and the ratatoskr-telegram-blobs group (install -d -o ratatoskr-telegram-webhook -g ratatoskr-telegram-blobs -m 2750).
  - Set RATATOSKR__SCHEDULE__OWNER_USER_ID for channel-digests to a real user in identity.users so the daily schedule registers.
  - "Provision the external credentials: an X developer app bearer token and a Meta app token. Without them X, Instagram and Threads refuse to start with a bus configured, by design."
  - Merge and deploy Platform, the extractor and X together because of the capture command break.
  - Recreate development databases from the edited schema.sql files.
rollback:
  - Stop the services (reverse of the start order), restore the previous NATS configuration, reload NATS, then restart Edge.
  - "Never delete provisioned durables: their cursors are the only record of what was consumed."
  - Revert the workspace pin commit to return to the previous snapshot. Nothing has shipped from this snapshot and the host is frozen (docs/DEPLOYMENT_TARGET.md), so there is no live deployment to roll back.
required_checks:
  - ./ws manifest check, ./ws lock check, ./ws status, ./ws doctor
  - cd harness and cargo fmt --all -- --check, cargo clippy --workspace --all-targets --all-features --locked -- -D warnings, cargo test --workspace --all-features --locked
  - openspec validate --all --strict and openspec validate --archived
  - each child's own gate before its push
  - integration profile contract tests under integration/tests
issues:
  refusal_only_telegram_images: https://github.com/po4yka/ratatoskr-telegram/issues/16
residual_risks:
  - evt.platform.operation.reported.v1 is one shared subject trusted by the envelope producer field; the extractor, X, Instagram, Threads and channel-digests can forge reports for one another and X can read every tenant's report metadata through its durable (per-producer subjects need a contract change).
  - The events stream drops its oldest messages when full (1 GiB or 7 days), and evt.knowledge.repository_analysis.requested.v1 is an event, so a very deep backlog could drop a request GitHub already marked published (a GitHub re-queue sweep is the recommended follow-up).
  - NATS caps a message at 1 MiB by default, so an oversized extracted document dead-letters in the extractor outbox.
  - GitHub's REST reference documents only 204 and 422 for DELETE /applications/{client_id}/grant; treating 404 as already revoked is undocumented provider behaviour taken from the contract (recorded in the GitHub commit).
  - Instagram's response classification is a starting point to correct against recorded live fixtures; X and Meta credentials are external dependencies the owner provisions.
  - The Telegram blob store is content-addressed and deduplicated across users; the guard on POST /v1/captures/blobs is the Telegram session kind, the owner allow-list and the unguessable digest.
  - integration/compose/export-agent-product.yaml is run by a script that writes its own narrow NATS file in which the ChatGPT and Claude identities may publish only their operation-report subject, while the XR-021 importers also publish eight ai_archive.* fact subjects; if that profile is run it will deny those publishes. It was not changed because it could not be run to show a failure (see composed_integration).
  - The host group ratatoskr-telegram-blobs and the thirteen nkeys do not exist yet; until they do, extractor blob runs fail with blob_unreadable and no identity can authenticate.
