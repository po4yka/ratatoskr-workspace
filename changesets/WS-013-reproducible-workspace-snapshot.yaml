compatibility:
  strategy: Pin already-published successful main commits; keep semantic metadata in workspace.toml, exact revisions in gitlinks, and derived evidence in workspace.lock.
  contract_or_schema_change: none
  event_migration: none
  database_change: none
  child_release_change: none
rollout:
  - Merge the coherent workspace commit after local and hosted snapshot checks pass.
  - Fresh clones initialize all sixteen public submodules recursively.
  - Operators use ws manifest check and ws lock check for authority consistency, ws status for read-only observation, and ws doctor as the strict gate.
rollback:
  - Before merge, remove only the isolated WS-013 worktree and branch after explicit confirmation.
  - After merge, revert the coherent workspace commit; child histories and published commits remain unchanged.
  - Never reset, clean, fetch, or check out a dirty child as part of rollback.
required_checks:
  - cargo fmt --all -- --check
  - cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
  - cargo test --workspace --all-features --locked
  - cargo deny check
  - openspec validate --all --strict
  - openspec validate --archived
  - actionlint .github/workflows/ci.yml
  - ./ws manifest check
  - ./ws lock check
  - ./ws status
  - ./ws doctor
delivery:
  branch: codex/ws-013-reproducible-snapshot
  pull_request: pending
  workspace_commit: pending
verification:
  local:
    rust_gate: cargo fmt, Clippy with warnings denied, and all workspace tests passed through one top-level build-gate; 29 named integration tests passed.
    dependency_policy: cargo deny reported advisories, bans, licenses, and sources all ok.
    openspec: named change, all 21 active items, and all 11 archived changes validated successfully under the requested strict modes.
    snapshot: manifest check, lock check, status, and doctor passed; before/after child HEAD and porcelain snapshots were byte-identical.
    workflow: actionlint accepted ci.yml; a local zizmor executable was unavailable.
    shell: root launcher, integration runners, and profile test scripts passed sh syntax checks.
    integration_contracts:
      - web operational profile contract passed.
      - Telegram deployment profile contract passed against pinned f814cdde49cd76000b7a20bb497a840b52fa99e0.
      - Telegram notification and library profile contract tests were attempted but could not start their Docker sentinel because no Docker daemon was available; no pass is claimed.
    pin_record: all 16 changeset pin values matched workspace.lock mechanically.
  hosted_ci: pending_push
  deployment: not_in_scope
  provider_end_to_end: not_in_scope
