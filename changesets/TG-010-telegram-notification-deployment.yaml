dependency_order:
  - ratatoskr-contracts
  - ratatoskr-platform
  - ratatoskr-telegram
  - ratatoskr-workspace
contract:
  event_type: platform.notification.raised.v1
  bus_subject: evt.platform.notification.raised.v1
  consumer: ratatoskr_telegram_notifications
  delivery: at-least-once-with-telegram-inbox-deduplication
ports:
  webhook_public: 8182
  webhook_operator: 9467
  dispatcher_operator: 9468
compatibility:
  strategy: Pre-provision the additive durable and least-privilege identity before Telegram; absence of events preserves current behavior.
  old_telegram: Leaves the pre-provisioned durable idle while producers retain their source facts.
  new_telegram: Preserves unknown well-formed classes and applies user preferences before enqueueing delivery.
database:
  strategy: Edit the Telegram current schema in place and create composed databases from schema.sql.
  migration_artifacts: none
privacy:
  allowed: [notification_id, class, recipient_user_ref, bounded_title, bounded_message, opaque_operation_ref, opaque_analysis_ref, preference_decision]
  forbidden: [bot_token, webhook_secret, nats_credentials, raw_telegram_updates, provider_credentials, private_domain_payloads]
rollout:
  - Verify the existing notification contract revision and subject convention.
  - Publish Platform fixed consumer provisioning and the least-privilege Telegram NATS identity.
  - Publish Telegram preference enforcement, durable consumption, deploy artifacts, and runbooks.
  - Update the workspace port contract and run the task-namespaced composed profile against the exact Telegram commit.
  - Record the verified child revision and composed evidence before advancing the workspace snapshot.
rollback:
  - Stop Telegram before revoking its NATS identity and roll back the Telegram binaries.
  - Retain the Platform-owned durable cursor unless an explicit operator action accepts backlog and cursor loss.
  - Retain preference and notification inbox rows so later replay remains deduplicated.
  - Remove only the TG-010 namespaced Compose resources; do not operate the frozen deployment target.
verification:
  planned:
    - Telegram preference and quiet-hours tests fail first and then pass.
    - Telegram deploy artifacts pass structural validation and runbook commands pass dry-run tests.
    - Platform provisions the exact durable and a real local broker enforces the Telegram NKey allow/deny matrix.
    - The composed smoke proves plan item 5 and one synthetic notification without production credentials or real chats.
    - Repository-local and workspace gates pass before commits are published.
