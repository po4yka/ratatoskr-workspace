id: SITE-028
state: implementing
openspec_change: bind-site-bundles-to-github
goal: The Sites server accepts and activates only bundles whose signed origin matches one owner-approved GitHub repository, digest, commit and trusted workflow.
non_goals: [private registries, new server GitHub credentials, production host operations, new API majors, database migrations, unrelated contracts repairs]
owner_decision: Server-side provenance verification approved on 2026-10-16.
runtime_dependency_decision: The owner explicitly approved pinned gh 2.102.0 and oras 1.3.0 for public GHCR on 2026-10-16. The real credential-free proof spike, ARM64 ABI and 512 MiB checks remain required.
signal_dependency_decision: The owner approved nix 0.30.1 (MIT), default features disabled and signal only, on 2026-10-16. It supplies safe process-group cleanup under the unsafe ban and adds no daemon or credential path.
authorization: Apply is active in the assigned task worktrees. The previous owner authorization covers scoped commits and pushes after successful checks. After the plan was presented, the owner approved its runtime dependency choice. Apply starts with the real public proof spike before child implementation.
