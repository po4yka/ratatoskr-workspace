dependency_order: contracts -> all expanded consumers at one revision -> approval producer -> SDK and Web -> integration and disposable provisioning -> verified workspace pins
compatibility: Keep the first API version; consumers decode the optional expanded binding before producers emit it. Deploy refuses absent binding and raw tar. Old clients fail clearly without a provenance bypass.
schema: Edit the current schema definitions in place and create fresh isolated test databases. Add no migrations or migration tooling.
rollout: No production operation in this change. The frozen host is excluded. Merge expanded contracts and consumers first, then producers and clients; publish only tested combined pins.
rollback: Stop deploy writes and preserve the last verified served bundle. Restoring an endpoint that bypasses provenance requires explicit owner approval. Keep the last verified bundle served while deploy writes are stopped. Restore a compatible snapshot as a set; do not silently restore the raw-tar route.
required_checks:
  - Real public OCI manifest and signed proof verification with no token or inherited tool config, plus changed-byte refusal.
  - Every functional acceptance check, each child DEVELOPMENT gate and green CI. Preserve the explicit owner exceptions for the three missing RED-order records.
  - Signature identity digest commit workflow runner and repository-name-reuse refusals.
  - Approval withdrawal and rebinding races, idempotency and verified offline rollback.
  - Bounded time memory output archive concurrency cancellation and process cleanup.
  - ARM64 ABI and license checks for pinned runtime tools, full disposable Molecule and zero-change replay.
  - All contracts consumers at one revision, generated types current, doctor deterministic lock and full integration.
