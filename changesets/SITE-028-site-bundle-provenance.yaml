id: SITE-028
state: planned
openspec_change: bind-site-bundles-to-github
goal: The Sites server accepts and activates only bundles whose signed origin matches one owner-approved GitHub repository, digest, commit and trusted workflow.
non_goals: [private registries, new server GitHub credentials, production host operations, new API majors, database migrations, unrelated contracts repairs]
owner_decision: Server-side provenance verification approved on 2026-10-16.
runtime_dependency_decision: Pending explicit approval of pinned gh 2.102.0 and oras 1.3.0 for public GHCR and local-proof verification. Do not install or add these runtime dependencies before approval.
authorization: Planning and evidence only in the workspace task worktree. The previous owner authorization covers scoped commits and pushes after successful checks. Child implementation starts only after the dependency decision and a new apply request following the presented plan.
workspace_writer:
  worktree: .workspaces/site-finish/workspace
  branch: finish-sites-acceptance
  base: 059aff900f68aba3f8e1fdb22a7670b72e3528a0
