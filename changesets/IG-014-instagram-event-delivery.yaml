rollout:
  - Merge and deploy the narrow Platform NATS policy before changing Instagram.
  - Stop every old Instagram process.
  - Run the confirmed logging-era repair; repeat on uncertain failure and require a successful repeated result of zero.
  - Deploy and start the acknowledged Instagram publisher.
  - Observe unpublished depth, failure classes, and the broker-enabled gauge without claiming downstream consumption.
  - Publish the workspace composed evidence after both child commits are known.
rollback:
  - Stop Instagram before restoring the prior binary.
  - Never run the retired logging publisher against repaired rows.
  - Retain all outbox rows and the three narrow Platform grants during diagnosis; neither deletes acknowledged facts.
  - Remove only IG-014 namespaced disposable integration resources.
