id: SITE-026
state: implementing
goal: Serve each approved site's static bundle by hostname from the single host behind cloudflared, forward the site's own API calls to Edge on the same origin, and deploy and roll back bundles that CI built and attested and that the controller and the host both verified.
openspec_change: add-site-gateway-hosting
depends_on:
  - SITE-025  # route classes, the Edge-owned approval routes, evt.platform.site_approval.changed.v1, the durable ratatoskr_sites_approvals, the sites schema and the /v1/sites prefix
  - DPL-022   # tasks groups 10 and 11 extend its Ansible playbook, host role, services.json, Molecule scenario with freeze_guard, and the harness test deploy_inventory.rs; they wait until DPL-022 is merged and archived
authorization: The owner authorised direct commits on main for the workspace planning records. For the child repositories the owner chose direct commits to main after an independent review instead of pull requests; each repository entry records its pushed commits, and the workspace pins a commit only after its CI is green.
