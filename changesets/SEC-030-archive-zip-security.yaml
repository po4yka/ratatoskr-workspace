id: SEC-030
state: local snapshot acceptance passed; workspace publication and CI pending
openspec_change: upgrade-archive-zip-security
parent: OBS-029 snapshot prerequisite
goal: Remove the advisory-blocked ZIP dependency from the four archive readers while keeping their extraction safety.
