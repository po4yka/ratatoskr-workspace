    role: unchanged-blob-transfer-and-operation-summary-input
    branch: main@d43b62a402f47984c95037c158ec29c5ee62ee5c
    writes: none
  - id: ratatoskr-platform
    role: operation-bound-resumable-transfer-and-single-host-control-plane
    branch: main@325db57eb3b970be274f772991c770e60ecde12b
    base: 070b718238c4e6e45a5b7fc08ebe719ed5374e33
  - id: ratatoskr-chatgpt
    role: restart-safe-chatgpt-import-and-terminal-report-producer
    branch: main@5cd597ea800b87c1f6d8f1c0b0e85adf47f4fe87
    base: 875e99abd6d0d550ac6d05040f31f6ba3e42c422
  - id: ratatoskr-claude
    role: restart-safe-claude-import-and-terminal-report-producer
    branch: main@989d2ba929b0355d3b3abc0e15d4f36c99652f43
