dependency_order:
  - ratatoskr-platform
  - [ratatoskr-chatgpt, ratatoskr-claude]
  - ratatoskr-export-agent
  - ratatoskr-workspace
contracts:
  shared_documents:
    - blob-transfer
    - ai-archive-operation-summary
  change: none
  binding: Platform operation-scoped open, chunk, status and finalize HTTP routes use the existing blob-transfer documents and one existing operation correlation.
compatibility:
  strategy: Replace the incomplete development whole-file path in place; publish Platform first, both provider receivers second, the client third, then the verified workspace snapshot.
  old_platform: Does not advertise the operation-bound resumable archive capability; the new agent refuses upload and retains local work.
  old_provider: Platform withholds that provider archive route while its receipt/import/report health is incompatible.
  old_agent: Continues using its existing incomplete behavior but gains no release; it is not part of the accepted snapshot.
database:
  strategy: Edit current Platform, ChatGPT and Claude schema.sql definitions in place and create disposable databases from them.
  migration_artifacts: none
api:
  version: 1
  negotiation: none
  generated_surface: ratatoskr-platform/openapi/openapi.json
  breaking_change: The development-only whole-file archive PUT is replaced by operation-bound resumable open, chunk, status and finalize routes; all known client call sites change together.
runtime:
  chatgpt_receipt: 127.0.0.1:8096/v1/ai-archives/receipt
  claude_receipt: 127.0.0.1:8097/v1/ai-archives/receipt
  bus: Separate least-privilege ChatGPT and Claude identities publish the unchanged terminal operation-report envelope on provider-scoped NATS ingress subjects consumed and provider-validated by Platform.
  terminal_rule: Raw ZIP persistence is progress only; terminal status follows the actual restart-safe parse/import and completeness report.
security:
  macos_authority: App Sandbox grants outbound network and user-selected read-write paths only; credentials remain in non-synchronizing Keychain.
  transfer_authority: Every transfer action is scoped to owner, active export-agent device, provider and operation; caller-controlled upstream routing and correlation headers are refused.
  provider_authority: Service bus identities cannot impersonate each other or subscribe to unrelated fleet subjects; anonymous publishing is refused.
privacy:
  allowed: [operation_id, provider_class, bounded_stage, aggregate_progress, aggregate_completeness, safe_error_class, redacted_device_id]
  forbidden: [provider_credentials, pairing_code, device_secret, access_token, refresh_token, archive_content, message_content, titles, filenames, local_paths, full_digest, raw_parser_diagnostics]
rollout:
  - Publish Platform operation-bound transfer, secured-bus configuration, provider gateway routes and readiness.
  - Publish ChatGPT and Claude restart-safe receipt/import/report runtimes in parallel after Platform fixtures are fixed.
  - Verify the server-only path against exact published revisions.
  - Publish Export Agent runtime and resumable client against the compatible server boundary.
  - Run the XPA-020 task-namespaced profile, record exact clean revisions, and advance the workspace snapshot.
  - With owner Apple credentials, publish the exact integrated notarized ZIP to GitHub Releases and perform separate clean-machine acceptance.
rollback:
  - Stop accepting new archive preparations before rolling clients or services back.
  - Roll back the manually installed Export Agent and workspace snapshot first, provider services second, and Platform configuration/code last.
  - Preserve local archives, journals, Platform operations, provider raw archives, import reports, release evidence and Apple tickets.
  - Remove only the exact XPA-020 integration namespace; do not touch another task or the frozen deployment target.
verification:
  planned:
    - Platform tests prove resumable interruption/restart, idempotence, ownership, digest verification, fixed provider routing, secure NATS permissions and health-backed capabilities.
    - ChatGPT and Claude tests prove raw receipt is non-terminal, parser/import resumes after restart, duplicate bytes still report every operation, and credentialed outbox rows survive outage.
    - Export Agent tests prove pairing restoration, mixed-provider routing, one runtime composition, same-operation resume, lifecycle reconciliation, local archive retention and truthful private UI.
    - The exact-revision workspace profile proves two synthetic providers, forced interruption and process restart, duplicate suppression, actual terminal completeness, privacy and isolated teardown.
    - Distribution tests prove fail-closed GitHub Release publication; notarization and clean-machine acceptance remain separate owner-authorized evidence.
evidence:
  local: repository_gates_green
  platform_remote_main: 325db57eb3b970be274f772991c770e60ecde12b
  chatgpt_remote_main: 5cd597ea800b87c1f6d8f1c0b0e85adf47f4fe87
  claude_remote_main: 989d2ba929b0355d3b3abc0e15d4f36c99652f43
  export_agent_remote_main: fdef58e281ea3c8e4519a6add8aee8185875bce1
  hosted_ci: pending
  workspace_profile: pending
  notarized_release: blocked_pending_owner_apple_credentials
  clean_machine: blocked_pending_notarized_release_and_separate_mac
  live_deployment: not_authorized
