id: KNO-018
state: implementing
goal: Make Knowledge durably consume the fleet's primary document and domain-event stream and recover every admitted analysis family across restart.
non_goals:
  - Implement or repair live X, Instagram, Threads, GitHub, ChatGPT, or Claude event publishers.
  - Treat canonical fixture injection as proof of a live producer, live provider, deployment, or hosted CI.
  - Read another service database, local path, or arbitrary URL as a repository-content boundary.
  - Add a second contract version or a database migration.
