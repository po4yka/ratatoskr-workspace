  - ratatoskr-contracts
  - ratatoskr-platform
  - ratatoskr-github
  - ratatoskr-knowledge
  - ratatoskr-extractor
  - ratatoskr-workspace
compatibility:
  strategy: Register the existing v1 document payload without wire drift, deploy backward-compatible topology and content readers before Knowledge, then update the producer and pins.
  contract_version: 1
  database_strategy: Edit each current schema definition in place; create fresh development databases; add no migrations.
  durable_strategy: Preserve Platform-owned consumer names and cursors; Knowledge verifies but never creates or repairs them.
live_publisher_dependencies:
  x: outside KNO-018; canonical fixture proof only
  instagram: outside KNO-018; canonical fixture proof only
  threads: outside KNO-018; canonical fixture proof only
  github: publication outside KNO-018; only the authenticated immutable README read boundary is in scope
  chatgpt: outside KNO-018; canonical fixture proof only
  claude: outside KNO-018; canonical fixture proof only
proof_categories:
  repository_local: focused and full repository checks run against a recorded task commit
  composed_fixture: exact task SHAs with real NATS/PostgreSQL and scripted provider; not live producer/provider proof
  push: remote branch resolves to the intended commit; not hosted CI or merge proof
  hosted_ci: required workflow runs observed on the exact commit
  live_producer: source service itself publishes through its deployed runtime
  live_provider: external provider accepted a real request; scripted provider is excluded
  deployment: target-host unit, credentials, topology, health, and functional behavior observed
  rollback: upstream claims stopped, bounded drain completed, durable cursor and database work preserved
rollout:
  - Publish the typed document-event contract and generated artifacts.
  - Provision exact Knowledge consumers and least-privilege identity, and publish the immutable GitHub read boundary.
  - Publish Knowledge with claims initially disabled; verify topology, dependencies, readiness, and backlog visibility before enabling claims.
  - Publish Extractor's typed construction after the Contracts commit is available.
  - Run the exact-SHA composed recovery/deletion/shutdown matrix.
  - Advance Workspace pins only to merged child commits after integration passes.
rollback:
  - Stop affected upstream publication or Knowledge work claims first.
  - Allow Knowledge to settle admission and drain its terminal outbox within the configured bound, then stop it.
  - Preserve ratatoskr_knowledge_main, ratatoskr_knowledge_channel_recap, both durable cursors, and Knowledge receipt/work/outbox rows.
  - Roll back deployables and pins in reverse dependency order without deleting broker state.
  - Recreate only the development Knowledge database when returning to the older first-version schema; never add or run a down migration.
