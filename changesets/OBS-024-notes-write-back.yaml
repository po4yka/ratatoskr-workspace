dependency_order:
  - ratatoskr-contracts
  - ratatoskr-notes      # ships with write mode off; its consumer waits for the durable Edge creates
  - ratatoskr-platform
  - [ratatoskr-obsidian-plugin, ratatoskr-export-agent, ratatoskr-web]
  - ratatoskr-workspace
contracts:
  shared_documents:
    - notes/write-request.v1
    - notes/conflict.v1
  subjects:
    - cmd.notes.file.write_requested.v1   # producer ratatoskr-platform only
    - evt.notes.conflict.raised.v1
    - evt.notes.conflict.resolved.v1
  durables:
    - ratatoskr_notes_write_requests      # NOTES, cmd.notes.file.write_requested.v1, 30 s; DOMAIN_CONSUMERS 25 -> 26
    - platform_notes_conflict_projection  # EDGE own consumer, evt.notes.conflict.>, 30 s; harness PLATFORM_ONLY 3 -> 4
  change: additive
openspec:
  modified_specs:
    - fleet-bus-topology    # written against the text xr-021-fleet-round-5 and OBS-023 leave after archive; 25 -> 26 service durables
    - notes-device-channels # ADDED requirements only; the spec exists only after OBS-023 archives
compatibility:
  strategy: Additive. Every connection starts with write mode off and behaves exactly as under OBS-023 until the owner turns write mode on.
database:
  strategy: The notes schema definition is edited in place; there are no migrations.
  migration_artifacts: none
api:
  version: 1
  negotiation: none
  breaking_change: none
runtime:
  supervision: each sync connection runs one of two fixed template units, ratatoskr-notes-sync-pull@<id>.service while the write mode is off and ratatoskr-notes-sync-bidi@<id>.service while it is on; the supervisor stops the unit of the other mode before it starts one. The polkit rule of the deploy role allows the four notes template units.
  host: ratatoskr-notes-sync joins ratatoskr-notes-trees; the trees root is 2770, the folders and files of a tree 2770 and 0660; the sync and login units run with UMask=0007, and the notes service keeps UMask=0027 for its blob store (decision 7.11).
security:
  secrets: none new. The write path reuses the Obsidian credentials that OBS-023 holds.
  authority: Edge authenticates the session and is the only producer of the write command; notes checks that the tenant owns the connection and answers a foreign connection like a missing one.
privacy: Write content is uploaded to notes and never enters Edge's outbox or JetStream. Conflict events carry hashes, not content. A pending write is invisible to every consumer until the vault acknowledges it.
rollout:
  - Contracts publishes the two contracts and registers the three types.
  - Notes ships with write mode off for every connection.
  - Platform ships the routes, the operation kinds, the two durables and the ACL lines.
  - The plugin, the export agent and the web client ship in any order.
  - The workspace advances the pins after the harness checks and the integration profile pass.
  - The owner turns write mode on per connection.
rollback:
  - Turn write mode off per connection; a sync connection returns to pull-only and undelivered writes fail.
  - Revert each repository's commit; nothing has shipped.
verification:
  - crates/notes-contracts/tests/write_request.rs and conflict.rs, and tools/contractsc/tests/live_message_types.rs in ratatoskr-contracts
  - services/notes/tests/bus_durables.rs, write_queue.rs, write_base_hash.rs, write_pending.rs, write_content.rs, write_idempotency.rs, write_authority.rs, write_operation.rs, write_mode.rs, conflict_merge.rs, echo.rs, delivery_plugin.rs, sync_mode.rs, sync_write.rs, link_rewrite_golden.rs and link_rewrite_atomic.rs in ratatoskr-notes
  - crates/public-api/tests/notes_writes.rs, crates/operations/tests/report_authority.rs, crates/eventing/tests/stream_table.rs and nats_permissions.rs in ratatoskr-platform
  - tests/apply-operation.test.ts, apply-kinds.test.ts, apply-paths.test.ts, apply-hardening.test.ts, transport-limits.test.ts and request-url.test.ts in ratatoskr-obsidian-plugin
  - Tests/AgentCoreTests/ObsidianCliApplyTests.swift, ObsidianCliApplyPathTests.swift, ObsidianCliApplyResultTests.swift, ObsidianCliApplyLocalTests.swift, ObsidianCliPropertyTests.swift, VaultSyncObsidianStatusTests.swift and NotesChannelHTTPTests.swift in ratatoskr-export-agent
  - src/features/notes/conflict-view.test.tsx and editor.test.tsx in ratatoskr-web
  - harness bus_acl.rs and the durable-name scan, and the notes-write-back integration profile in ratatoskr-workspace
