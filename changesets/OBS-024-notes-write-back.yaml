id: OBS-024
state: implementing
goal: Let Ratatoskr create, edit, rename, move and delete files in a connected Obsidian vault through the connection's one channel, with pending writes that become current only on the channel's acknowledgement, a required base revision, conflicts that the owner resolves, echo suppression and Obsidian-compatible link rewriting.
openspec_change: add-notes-write-back
depends_on:
  - OBS-023  # add-notes-vault-connections: connections, channels, index, revisions; archived first, after xr-021-fleet-round-5
authorization: The owner authorised direct commits on main for the workspace planning records. For the child repositories the owner chose direct commits to main after an independent review instead of pull requests; each repository entry records its pushed commits, and the workspace pins a commit only after its CI is green.
