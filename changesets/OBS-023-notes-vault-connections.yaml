dependency_order:
  - ratatoskr-contracts
  - ratatoskr-notes
  - ratatoskr-platform
  - ratatoskr-knowledge    # its durables must exist first
  - [ratatoskr-obsidian-plugin, ratatoskr-export-agent, ratatoskr-web]
  - ratatoskr-workspace    # membership, deploy, harness, integration, pins
contracts:
  shared_documents:
    - docs/NOTES_AND_SITES.md
    - docs/adr/0010-notes-and-obsidian-vault-connections.md
  change:
    - notes.vault.connected.v1 (new)
    - notes.vault.disconnected.v1 (new)
    - notes.file.changed.v1 (new)
    - operation kind notes.connection.connect (new)
compatibility:
  strategy: Additive. Every new contract is version 1. Existing requirements gain a member (a repository, a role, an identity, two durables, a listener) and lose nothing.
database:
  strategy: New schema notes in the database ratatoskr, created from ratatoskr-notes schema.sql. No other schema changes.
  migration_artifacts: none
api:
  version: 1
  negotiation: none
  breaking_change: none
runtime:
  supervision: ratatoskr-notes as a systemd unit in ratatoskr.target; one ratatoskr-notes-sync@<connection id>.service per sync connection, and the oneshot ratatoskr-notes-login@ and ratatoskr-notes-cleanup@ units, all started by ratatoskr-notes through the systemd D-Bus API under one polkit rule.
  new_dependencies: Node.js 22 and the obsidian-headless npm package at a pinned version, on the host only.
  ports: 8099 (notes domain API, loopback, through Edge) and 9471 (notes operator listener, host only).
security:
  secrets: The Obsidian account password and the end-to-end password are stored only as ciphertext under /etc/ratatoskr/notes-secrets.key; the MFA code is never stored. Edge proxies the connect body and persists or logs none of it. Login and cleanup run as oneshot template units (ratatoskr-notes-login@, ratatoskr-notes-cleanup@) that get secrets through LoadCredential=; spike 3.2 found that ob reads both passwords from standard input, so only the one-time MFA code is in argv. No secret enters argv of a visible process, logs, events or operation records.
  device_channels: Edge mints a device-kind claim; ratatoskr-notes enforces the owner (404) and the channel (notes.channel_mismatch). One device per plugin or cli connection. The plugin credential never enters the vault folder.
  blob_access: The notes blob root belongs to the group ratatoskr-notes-blobs (setgid, umask 0027); the Knowledge service user is the only member in this change.
  tree_access: The working trees are under /mnt/nvme/ratatoskr/notes/trees (owner ratatoskr-notes-sync, group ratatoskr-notes-trees, setgid 2750, units with UMask=0027); ratatoskr-notes is the only member of the group. The ob client states, which hold the Sync token and the end-to-end key in plain text, are under /mnt/nvme/ratatoskr/notes/clients (ratatoskr-notes-sync, 0700). Owner decision B of 2026-10-14.
  journal_access: The sync units log to the journal namespace ratatoskr-notes-sync. A tmpfiles.d ACL gives the group ratatoskr-notes read access to that namespace only; ratatoskr-notes is not in systemd-journal. Owner decision A of 2026-10-14.
  server_access: The host can read every connected vault, end-to-end encrypted vaults included. The connect flow says so before it asks for the end-to-end password.
  freeze: The real host is not touched until the owner lifts the freeze in docs/DEPLOYMENT_TARGET.md.
privacy: Note content is user content. It leaves ratatoskr-notes only as BlobRefs that Knowledge resolves read-only. Disconnect removes the working tree, the client state, the ciphertext and all Knowledge-derived data.
