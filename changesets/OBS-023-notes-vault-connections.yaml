id: OBS-023
state: planned
goal: Connect Obsidian vaults to Ratatoskr through exactly one channel each (Obsidian Headless Sync on the host, an Obsidian plugin, or the macOS export agent with the Obsidian CLI), index their files with Obsidian's link rules, and give note changes to Knowledge. Read path only.
openspec_change: add-notes-vault-connections
# DPL-022 provides the Ansible tree, Molecule, the freeze guard, services.json and deploy_inventory.rs
# that tasks 14.6 and 14.7 extend. xr-021-fleet-round-5 must be archived before this change, because
# the fleet-bus-topology delta is written against its text.
depends_on: [DPL-022]
authorization: The owner authorised direct commits on main for the workspace planning records. Each child repository works on its task branch and merges through a pull request.
