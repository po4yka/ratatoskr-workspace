allowed_paths: Notes wire contracts, their tests and fixtures, generated artifacts and API baseline; consumer contract pins
  and locks; Platform consumer and path acceptance tests; Notes group conflict producer and tests; owning documentation; workspace
  integration, changesets, pins and generated lock.
dependency_order: Contracts with green CI, then the expanded strict Platform conflict consumer with green CI, then Notes event
  emission. Pin-only consumers and generated clients can run alongside this chain. Every selected child must pass before combined
  snapshot promotion.
compatibility: First major only. Stricter write validation is the requested development correction. stale_paths is optional
  and omitted when absent; old strict consumers must be updated before new events are produced.
database: No schema change and no migration.
privacy: stale_paths contains owner-scoped private vault path metadata; no content, credentials or broader audience is added.
rollout: Publish reviewed children directly to main, verify exact commit CI, test their combined snapshot, then publish workspace
  pins and verify root CI.
rollback: Stop promotion if a gate fails. After publication, prepare a verified corrective snapshot that retains the SEC-030
  ZIP fixes. Stop new field emission in Notes first. Keep the expanded Platform reader while the stream can replay stale_paths
  events. Do not publish the old ZIP 8.6.0 graph as a normal rollback release.
non_goals:
- production deployment
- Sync account or MFA tests
- database changes
- new API major
- new dependencies
- unrelated upgrades
- original OBS-024 archive
