publication_order_note: Notes was published after Platform CI while unrelated pin-only checks were still running. Source inspection
  found no conflict-event reader outside Platform; Notes produces the event and Contracts defines it. This refines the initial
  over-serial dependency description. No production deployment occurred, and all child CI remains mandatory before pins.
