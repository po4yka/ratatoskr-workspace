id: OBS-029
state: implementing
openspec_change: complete-notes-write-contracts
parent: OBS-024 tasks 3.13-3.16
goal: Align portable write paths and optional stale group paths across contracts and their consumers.
authorization: The owner explicitly requests OpenSpec, TDD, consumer checks, CI, verified pins, scoped commits and pushes.
  Existing direct-to-main publication after independent review remains authorized. No production operation is included.
