id: SITE-027
state: implementing
goal: Let the owner of a site sign in on the site's own origin with a session valid only for that site, edit the site's source notes through the notes write path, request releases, receive live events, and read the owner's library and knowledge search, all bounded by the effective capability set that SITE-025 defines.
openspec_change: add-site-owner-editing-and-live
depends_on:
  - OBS-024   # add-notes-write-back: cmd.notes.file.write_requested.v1 with origin, BlobRef content, conflicts, platform_notes_conflict_projection
  - SITE-025  # add-site-publications: manifest, identity.site_approvals, effective set, release route and modes
  - SITE-026  # add-site-gateway-hosting: the gateway, /_r/, /.ratatoskr/ and X-Ratatoskr-Client-IP
authorization: The owner authorised direct commits on main for the workspace planning records. For the child repositories the owner chose direct commits to main after an independent review instead of pull requests; each repository entry records its pushed commits, and the workspace pins a commit only after its CI is green.
