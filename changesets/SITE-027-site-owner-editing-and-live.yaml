  - platform crates/identity/tests/site_sign_in.rs and site_owner_session.rs; crates/eventing/tests/stream_table.rs and nats_permissions.rs
  - workspace harness/crates/workspace-core/tests/bus_acl.rs and bus_durables.rs
  - platform crates/public-api/tests/site_sessions.rs, site_capabilities.rs, site_events.rs, site_edits.rs, site_library.rs and sessions.rs
  - sites crates/sites/tests/scope.rs and draft_events.rs; services/sites/tests/route_classes.rs; services/sites/tests/bus.rs
  - site-sdk src/owner/sign-in.test.ts, template/template.test.ts, src/live/events.test.ts and src/owner/edit.test.ts
  - web src/features/sites/SiteSignInConsent.test.tsx and the session list test
  - workspace integration/run-site-owner-editing.sh and integration/tests/site_owner_editing_profile_test.sh
