# The verify cases of openspec/specs/host-provisioning (DPL-022), run against
# the converged stand-in. The cases that need a whole run of the playbook (the freeze guard, a pin
# that disagrees with the lock, a tampered artifact cache, the rerun and the secret scan) run it
# again from the controller, against this same target.

- name: Verify the converged host
  hosts: all
  become: true
  gather_facts: false
  vars:
    project: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
    inventory: "{{ lookup('env', 'MOLECULE_INVENTORY_FILE') }}"
    workspace: "{{ (project ~ '/../..') | realpath }}"
    state: /var/lib/ratatoskr-deploy
    scratch: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/verify"
    playbook: >-
      cd {{ project }} && ANSIBLE_FORCE_COLOR=0 ansible-playbook -i {{ inventory }} site.yml
  tasks:
    - name: The enrolment, the pins and the host facts the cases compare against
      ansible.builtin.set_fact:
        services: "{{ (lookup('ansible.builtin.file', project ~ '/group_vars/all/services.json') | from_json).ratatoskr_services }}"
        template_units: "{{ (lookup('ansible.builtin.file', project ~ '/group_vars/all/services.json') | from_json).ratatoskr_template_units }}"
        pins: "{{ lookup('ansible.builtin.file', workspace ~ '/workspace.lock') | ratatoskr_lock }}"

    - name: A scratch directory on the controller
      ansible.builtin.file:
        path: "{{ scratch }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    # --- host_facts -------------------------------------------------------------------------------
    - name: "host_facts: every user exists with its own group and memberships"
      ansible.builtin.command: id -nG {{ item }}
      register: ids
      changed_when: false
      loop:
        - ratatoskr-edge
        - ratatoskr-ingest
        - ratatoskr-scheduler
        - ratatoskr-extractor
        - ratatoskr-telegram-webhook
        - ratatoskr-telegram-dispatcher
        - ratatoskr-nats
        - ratatoskr-sites

    - name: "host_facts: each user's first group is its own"
      ansible.builtin.assert:
        that: (item.stdout.split() | first) == item.item
        quiet: true
      loop: "{{ ids.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: "host_facts: directory owners and modes"
      ansible.builtin.stat:
        path: "{{ item.path }}"
      register: dirs
      loop:
        - {path: /etc/ratatoskr, owner: root, group: ratatoskr, mode: "0750"}
        - {path: /mnt/nvme/ratatoskr/logs, owner: root, group: ratatoskr, mode: "0770"}
        - {path: /mnt/nvme/ratatoskr/nats, owner: ratatoskr-nats, group: ratatoskr-nats, mode: "0700"}
        - {path: /mnt/nvme/ratatoskr/blobs/ratatoskr-extractor, owner: ratatoskr-extractor, group: ratatoskr-extractor, mode: "0700"}
        - {path: /mnt/nvme/ratatoskr/blobs/ratatoskr-telegram, owner: ratatoskr-telegram-webhook, group: ratatoskr-telegram-blobs, mode: "2750"}
        - {path: /mnt/nvme/ratatoskr/blobs/ratatoskr-sites, owner: ratatoskr-sites, group: ratatoskr-sites, mode: "0700"}
        - {path: /mnt/nvme/ratatoskr/archive-staging, owner: ratatoskr-edge, group: ratatoskr-edge, mode: "0700"}
        - {path: /var/lib/ratatoskr-telegram, owner: ratatoskr-telegram-webhook, group: ratatoskr-telegram-webhook, mode: "0750"}
      loop_control:
        label: "{{ item.path }}"

    - name: "host_facts: each directory is as the deploy guides require"
      ansible.builtin.assert:
        that:
          - item.stat.isdir
          - item.stat.pw_name == item.item.owner
          - item.stat.gr_name == item.item.group
          - item.stat.mode == item.item.mode
        fail_msg: "{{ item.item.path }}: {{ item.stat.pw_name }}:{{ item.stat.gr_name }} {{ item.stat.mode }}"
        quiet: true
      loop: "{{ dirs.results }}"
      loop_control:
        label: "{{ item.item.path }}"

    - name: "host_facts: the ufw rule for the monitoring bridge is recorded"
      ansible.builtin.command: ufw show added
      register: ufw
      changed_when: false

    - name: "host_facts: it names the bridge subnet and the five operator ports"
      ansible.builtin.assert:
        that: ufw.stdout is search('allow from 172\.19\.0\.0/16 to any port 9464:9468 proto tcp')
        fail_msg: "{{ ufw.stdout }}"

    - name: "host_facts: ratatoskr.target is enabled"
      ansible.builtin.command: systemctl is-enabled ratatoskr.target
      changed_when: false

    # --- units_identical ----------------------------------------------------------------------------
    - name: "units_identical: checksum of each installed unit"
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ item.unit }}"
        checksum_algorithm: sha256
      register: installed
      loop: "{{ services + [{'unit': 'ratatoskr.target', 'repository': 'platform'}] }}"
      loop_control:
        label: "{{ item.unit }}"

    - name: "units_identical: checksum of each pinned source"
      ansible.builtin.stat:
        path: "{{ workspace }}/{{ pins[item.repository].path }}/deploy/systemd/{{ item.unit }}"
        checksum_algorithm: sha256
      register: pinned_units
      delegate_to: localhost
      become: false
      loop: "{{ services + [{'unit': 'ratatoskr.target', 'repository': 'platform'}] }}"
      loop_control:
        label: "{{ item.unit }}"

    - name: "units_identical: every installed unit is byte-identical to its pinned source"
      ansible.builtin.assert:
        that: item.0.stat.checksum == item.1.stat.checksum
        fail_msg: "{{ item.0.item.unit }} differs from {{ item.0.item.repository }}"
        quiet: true
      loop: "{{ installed.results | zip(pinned_units.results) | list }}"
      loop_control:
        label: "{{ item.0.item.unit }}"

    # --- notes_sync_unit ---------------------------------------------------------------------------
    # The template units of ratatoskr-notes that its pin ships (services.json lists them), the
    # Obsidian Headless client they run, its user, and the polkit rule through which the notes
    # service user starts and stops their instances (add-notes-vault-connections, design D3). The
    # expected values are the ones spike 3.2 recorded, not the playbook's variables.
    - name: "notes_sync_unit: the notes template units that the inventory lists"
      ansible.builtin.set_fact:
        notes_templates: "{{ template_units | selectattr('repository', 'equalto', 'notes') | list }}"

    - name: "notes_sync_unit: checksum of each installed template unit"
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ item.unit }}"
        checksum_algorithm: sha256
      register: notes_installed
      loop: "{{ notes_templates }}"
      loop_control:
        label: "{{ item.unit }}"

    - name: "notes_sync_unit: checksum of each pinned template unit"
      ansible.builtin.stat:
        path: "{{ workspace }}/{{ pins[item.repository].path }}/deploy/systemd/{{ item.unit }}"
        checksum_algorithm: sha256
      register: notes_pinned
      delegate_to: localhost
      become: false
      loop: "{{ notes_templates }}"
      loop_control:
        label: "{{ item.unit }}"

    - name: "notes_sync_unit: every listed template unit is installed, byte-identical to its pin"
      ansible.builtin.assert:
        that:
          - item.0.stat.exists
          - item.0.stat.checksum == item.1.stat.checksum
        fail_msg: "{{ item.0.item.unit }} is missing or differs from notes"
        quiet: true
      loop: "{{ notes_installed.results | zip(notes_pinned.results) | list }}"
      loop_control:
        label: "{{ item.0.item.unit }}"

    - name: "notes_sync_unit: no template unit is enabled"
      ansible.builtin.command: systemctl is-enabled {{ item.unit }}
      register: notes_enabled
      changed_when: false
      failed_when: notes_enabled.stdout | trim not in ['static', 'disabled']
      loop: "{{ notes_templates }}"
      loop_control:
        label: "{{ item.unit }}"

    - name: "notes_sync_unit: no instance of a template unit was started"
      ansible.builtin.command:
        argv: [systemctl, list-units, --all, --plain, --no-legend, "{{ item.unit | replace('@.service', '@*') }}"]
      register: notes_instances
      changed_when: false
      failed_when: notes_instances.stdout | trim | length > 0
      loop: "{{ notes_templates }}"
      loop_control:
        label: "{{ item.unit }}"

    - name: "notes_sync_unit: the Node.js version"
      ansible.builtin.command: node --version
      register: notes_node
      changed_when: false

    - name: "notes_sync_unit: Node.js is version 22"
      ansible.builtin.assert:
        that: notes_node.stdout is match('v22\.')
        fail_msg: "node --version: {{ notes_node.stdout }}"

    # ob runs as root at install time and as ratatoskr-notes-sync at run time, so every package and
    # every downloaded binary of its tree is pinned and checked before use. The tree is installed
    # from the committed lockfile, with the npm integrity of every package, into a prefix that only
    # root writes; no lifecycle script runs, so nothing downloads at install time. The native module
    # of better-sqlite3 is the prebuilt of the release, with the sha256 recorded for each
    # architecture that runs the playbook (the Pi and the CI runner are arm64).
    - name: "notes_sync_unit: the committed lockfile of ob"
      ansible.builtin.set_fact:
        notes_lock: "{{ lookup('ansible.builtin.file', project ~ '/roles/nodejs/files/obsidian-headless/package-lock.json') | from_json }}"
        notes_native_sha256:
          arm64: c3352cb3b127d28c8163e827dbb8575bef3b5cdff4b2206d562197b5c448f3ea

    - name: "notes_sync_unit: how the installed tree differs from the committed lockfile"
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, os, sys
            lock, root, wrong = json.load(sys.stdin), sys.argv[1], []
            want = {key: entry for key, entry in lock['packages'].items() if key}
            def read(path):
                try:
                    with open(path) as f:
                        return json.load(f)
                except (OSError, ValueError):
                    return None
            hidden = (read(root + '/node_modules/.package-lock.json') or {}).get('packages', {})
            for key, entry in sorted(want.items()):
                if not str(entry.get('integrity', '')).startswith('sha512-'):
                    wrong.append(key + ': the lockfile records no sha512 integrity')
                if not str(entry.get('resolved', '')).startswith('https://registry.npmjs.org/'):
                    wrong.append(key + ': the lockfile resolves it outside registry.npmjs.org')
                for field in ('version', 'resolved', 'integrity'):
                    if hidden.get(key, {}).get(field) != entry.get(field):
                        wrong.append(f'{key}: installed {field} {hidden.get(key, {}).get(field)}')
                if (read(os.path.join(root, key, 'package.json')) or {}).get('version') != entry.get('version'):
                    wrong.append(f'{key}: the installed package.json is not version {entry.get("version")}')
            def walk(base):
                for name in sorted(os.listdir(base)) if os.path.isdir(base) else []:
                    if name.startswith('.'):
                        continue
                    path = os.path.join(base, name)
                    for package in [os.path.join(path, n) for n in sorted(os.listdir(path))] if name.startswith('@') else [path]:
                        yield os.path.relpath(package, root)
                        yield from walk(os.path.join(package, 'node_modules'))
            for key in sorted((set(walk(root + '/node_modules')) | set(hidden)) - set(want) - {''}):
                wrong.append(key + ': installed and not in the lockfile')
            print('\n'.join(wrong))
          - /opt/ratatoskr-ob
        stdin: "{{ notes_lock | to_json }}"
      register: notes_tree
      changed_when: false

    - name: "notes_sync_unit: the native module of better-sqlite3"
      ansible.builtin.stat:
        path: /opt/ratatoskr-ob/node_modules/better-sqlite3/build/Release/better_sqlite3.node
        checksum_algorithm: sha256
      register: notes_native

    - name: "notes_sync_unit: the architecture of the host"
      ansible.builtin.command: dpkg --print-architecture
      register: notes_arch
      changed_when: false

    # node-gyp would leave a Makefile and objects in build/, and prebuild-install keeps each download
    # in npm's cache, under _prebuilds.
    - name: "notes_sync_unit: what better-sqlite3's build directory holds"
      ansible.builtin.command: find /opt/ratatoskr-ob/node_modules/better-sqlite3/build -mindepth 1 -printf '%P\n'
      register: notes_build
      changed_when: false
      failed_when: false

    - name: "notes_sync_unit: npm's cache of prebuilt downloads"
      ansible.builtin.stat:
        path: /root/.npm/_prebuilds
      register: notes_prebuilds

    - name: "notes_sync_unit: whether npm runs a lifecycle script in the prefix"
      ansible.builtin.command:
        cmd: npm config get ignore-scripts
        chdir: /opt/ratatoskr-ob
      register: notes_ignore_scripts
      changed_when: false
      failed_when: false

    - name: "notes_sync_unit: files of the prefix that are not root's, or that a group or other may write"
      ansible.builtin.command: find /opt/ratatoskr-ob ! -type l ( ! -user root -o ! -group root -o -perm /022 ) -print
      register: notes_writable
      changed_when: false
      failed_when: false

    - name: "notes_sync_unit: ob's tree is the committed lockfile, its native module the recorded prebuilt, and no lifecycle script ran"
      ansible.builtin.assert:
        that:
          - notes_tree.stdout == ''
          - notes_native.stat.exists
          - notes_native.stat.checksum == notes_native_sha256[notes_arch.stdout | trim] | default('no hash recorded')
          - notes_native.stat.pw_name == 'root' and notes_native.stat.mode == '0644'
          - notes_build.stdout_lines == ['Release', 'Release/better_sqlite3.node']
          - not notes_prebuilds.stat.exists
          - notes_ignore_scripts.stdout | trim == 'true'
          - notes_writable.rc == 0 and notes_writable.stdout == ''
        fail_msg: >-
          tree: {{ notes_tree.stdout }};
          native module: {{ notes_native.stat.checksum | default('missing') }} on {{ notes_arch.stdout }};
          build: {{ notes_build.stdout_lines }}; _prebuilds: {{ notes_prebuilds.stat.exists }};
          ignore-scripts: {{ notes_ignore_scripts.stdout }}{{ notes_ignore_scripts.stderr | default('') }};
          not root's or writable: {{ notes_writable.stdout }}{{ notes_writable.stderr }}

    - name: "notes_sync_unit: the native module of ob loads"
      ansible.builtin.command:
        argv:
          - node
          - -e
          - new (require('/opt/ratatoskr-ob/node_modules/better-sqlite3'))(':memory:').close()
      changed_when: false

    - name: "notes_sync_unit: /usr/bin/ob, which the units start"
      ansible.builtin.command: readlink -f /usr/bin/ob
      register: notes_ob
      changed_when: false

    - name: "notes_sync_unit: obsidian-headless 0.0.14, with the integrity recorded by spike 3.2"
      ansible.builtin.assert:
        that:
          - notes_lock.packages['node_modules/obsidian-headless'].version == '0.0.14'
          - notes_lock.packages['node_modules/obsidian-headless'].integrity == 'sha512-S1d/hxLKvCUG2g5tRyXFkzPqMs3Ntw1tDyzoF2yfHGRuB4B+Mi3X2vgT8LbfQKrkEEi3LfJRdXtYzAVHcbpccw=='
          - notes_ob.stdout | trim == '/opt/ratatoskr-ob/node_modules/obsidian-headless/cli.js'
        fail_msg: "{{ notes_lock.packages['node_modules/obsidian-headless'] }} {{ notes_ob.stdout }}"

    - name: "notes_sync_unit: the user that runs ob"
      ansible.builtin.command: id -nG ratatoskr-notes-sync
      register: notes_sync_user
      changed_when: false

    # OBS-024, decision 7.11: the user that runs ob shares the tree group with the notes service,
    # and no other group.
    - name: "notes_sync_unit: ratatoskr-notes-sync is in its own group and the tree group only"
      ansible.builtin.assert:
        that: notes_sync_user.stdout.split() == ['ratatoskr-notes-sync', 'ratatoskr-notes-trees']
        fail_msg: "id -nG ratatoskr-notes-sync: {{ notes_sync_user.stdout }}"

    # The units run /usr/bin/ob as ratatoskr-notes-sync, with the PATH that systemd gives a unit and
    # a HOME and XDG_CONFIG_HOME of their own. ob must start for that user, not only for root.
    - name: "notes_sync_unit: ob --help, as ratatoskr-notes-sync"
      ansible.builtin.command:
        argv:
          - setpriv
          - --reuid=ratatoskr-notes-sync
          - --regid=ratatoskr-notes-sync
          - --init-groups
          - env
          - -i
          - PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin
          - /bin/sh
          - -c
          - >-
            home="$(mktemp -d)" || exit 99;
            HOME="$home" XDG_CONFIG_HOME="$home" /usr/bin/ob --help;
            status=$?; rm -rf "$home"; exit "$status"
      register: notes_ob_help
      changed_when: false
      failed_when: false

    - name: "notes_sync_unit: ob starts as ratatoskr-notes-sync"
      ansible.builtin.assert:
        that: notes_ob_help.rc == 0
        fail_msg: "ob --help as ratatoskr-notes-sync: exit {{ notes_ob_help.rc }}: {{ notes_ob_help.stderr }}"

    # pkcheck asks polkitd what systemd asks it for StartUnit and StopUnit: the action, the unit and
    # the verb, for a process of the subject user. Exit 0 allows; 1 or 2 refuses; another code is an
    # error and fails the case. RestartUnit, KillUnit and ResetFailedUnit ask the same action with
    # the verbs restart, kill and reset-failed, which the rule must refuse.
    - name: "notes_sync_unit: ratatoskr-notes starts and stops exactly the listed units, with a UUID instance only"
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -uo pipefail
          uuid=3f2b8c1e-5a4d-4e6f-9b7a-1c2d3e4f5a6b
          listed=" {{ notes_templates | map(attribute='unit') | join(' ') }} "
          wrong=""
          check() {  # user action unit verb allowed|refused
            setpriv --reuid="$1" --regid="$1" --init-groups sleep 30 &
            local pid=$!
            sleep 0.5
            pkcheck --action-id "org.freedesktop.systemd1.$2" --process "$pid" \
              --detail unit "$3" --detail verb "$4" >/dev/null 2>&1
            local rc=$?
            kill "$pid" 2>/dev/null; wait "$pid" 2>/dev/null
            case "$5:$rc" in
              allowed:0|refused:1|refused:2) ;;
              *) wrong="$wrong$1 $2 $3 $4: exit $rc, want $5"$'\n' ;;
            esac
          }
          # ratatoskr-notes-sync@ is the one sync unit before OBS-024 7.33; it is no longer listed, so
          # the rule must refuse it.
          for template in ratatoskr-notes-sync-pull@.service ratatoskr-notes-sync-bidi@.service ratatoskr-notes-login@.service ratatoskr-notes-cleanup@.service ratatoskr-notes-sync@.service; do
            instance="${template/@./@$uuid.}"
            case "$listed" in *" $template "*) want=allowed ;; *) want=refused ;; esac
            check ratatoskr-notes manage-units "$instance" start "$want"
            check ratatoskr-notes manage-units "$instance" stop "$want"
            check ratatoskr-notes manage-units "$instance" restart refused
            check ratatoskr-notes manage-units "$instance" kill refused
            check ratatoskr-notes manage-units "$instance" reset-failed refused
            check ratatoskr-notes manage-units "${template/@./@not-a-uuid.}" start refused
            check ratatoskr-notes manage-units "${template/@./@${uuid^^}.}" start refused
            check ratatoskr-notes manage-units "${template/@./@$uuid-0.}" start refused
            check ratatoskr-notes manage-unit-files "$instance" enable refused
            check ratatoskr-notes-sync manage-units "$instance" start refused
          done
          check ratatoskr-notes manage-units ratatoskr-edge.service stop refused
          printf '%s' "$wrong"
          [ -z "$wrong" ]
      changed_when: false

    # --- notes_blob_read_group ---------------------------------------------------------------------
    # The blob root of ratatoskr-notes is setgid with the read group, and Knowledge and Sites are its
    # only members (design D12; SITE-025, design D3). The playbook creates no ratatoskr-x user while
    # X is not enrolled, so the case refuses a read by EVERY ratatoskr-* user outside the group,
    # which includes ratatoskr-x whenever it exists. The fixture blob is written as ratatoskr-notes
    # writes, with umask 0027.
    - name: "notes_blob_read_group: the group"
      ansible.builtin.command: getent group ratatoskr-notes-blobs
      register: notes_blob_group
      changed_when: false

    - name: "notes_blob_read_group: Knowledge and Sites are the only members"
      ansible.builtin.assert:
        that: notes_blob_group.stdout.split(':')[3] | trim | split(',') | sort == ['ratatoskr-knowledge', 'ratatoskr-sites']
        fail_msg: "{{ notes_blob_group.stdout }}"

    - name: "notes_blob_read_group: the blob root"
      ansible.builtin.stat:
        path: /mnt/nvme/ratatoskr/blobs/ratatoskr-notes
      register: notes_blob_root

    - name: "notes_blob_read_group: owned by ratatoskr-notes, setgid with the read group, mode 2750"
      ansible.builtin.assert:
        that:
          - notes_blob_root.stat.isdir
          - notes_blob_root.stat.pw_name == 'ratatoskr-notes'
          - notes_blob_root.stat.gr_name == 'ratatoskr-notes-blobs'
          - notes_blob_root.stat.mode == '2750'
        fail_msg: "blob root: {{ notes_blob_root.stat.pw_name | default('') }}:{{ notes_blob_root.stat.gr_name | default('') }} {{ notes_blob_root.stat.mode | default('missing') }}"

    - name: "notes_blob_read_group: a blob, written by ratatoskr-notes with umask 0027"
      ansible.builtin.command:
        argv:
          - setpriv
          - --reuid=ratatoskr-notes
          - --regid=ratatoskr-notes
          - --init-groups
          - /bin/sh
          - -c
          - >-
            umask 0027
            && mkdir -p /mnt/nvme/ratatoskr/blobs/ratatoskr-notes/sha256/00
            && printf fixture > /mnt/nvme/ratatoskr/blobs/ratatoskr-notes/sha256/00/molecule-fixture
      changed_when: true

    - name: "notes_blob_read_group: the blob and its directories"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: notes_blob
      loop:
        - /mnt/nvme/ratatoskr/blobs/ratatoskr-notes/sha256
        - /mnt/nvme/ratatoskr/blobs/ratatoskr-notes/sha256/00
        - /mnt/nvme/ratatoskr/blobs/ratatoskr-notes/sha256/00/molecule-fixture

    - name: "notes_blob_read_group: each inherits the read group; directories 2750, the blob 0640"
      ansible.builtin.assert:
        that:
          - item.stat.gr_name == 'ratatoskr-notes-blobs'
          - item.stat.mode == ('2750' if item.stat.isdir else '0640')
        fail_msg: "{{ item.item }}: {{ item.stat.gr_name }} {{ item.stat.mode }}"
        quiet: true
      loop: "{{ notes_blob.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: "notes_blob_read_group: Knowledge and Sites read the blob, and no other ratatoskr-* user can"
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -uo pipefail
          blob=/mnt/nvme/ratatoskr/blobs/ratatoskr-notes/sha256/00/molecule-fixture
          wrong=""
          reads() { setpriv --reuid="$1" --regid="$1" --init-groups cat "$blob" >/dev/null 2>&1; }
          reads ratatoskr-knowledge || wrong="${wrong}ratatoskr-knowledge cannot read the blob"$'\n'
          reads ratatoskr-sites || wrong="${wrong}ratatoskr-sites cannot read the blob"$'\n'
          others=0
          for user in $(getent passwd | cut -d: -f1 | grep '^ratatoskr-'); do
            case "$user" in ratatoskr-notes|ratatoskr-knowledge|ratatoskr-sites) continue ;; esac
            others=$((others + 1))
            if reads "$user"; then wrong="${wrong}${user} reads the blob"$'\n'; fi
          done
          [ "$others" -gt 0 ] || wrong="${wrong}no ratatoskr-* user outside the group to try"$'\n'
          printf '%s' "$wrong"
          [ -z "$wrong" ]
      changed_when: false

    - name: "notes_blob_read_group: remove the fixture blob"
      ansible.builtin.file:
        path: /mnt/nvme/ratatoskr/blobs/ratatoskr-notes/sha256
        state: absent

    # --- notes_trees_and_clients ---------------------------------------------------------------------
    # Owner decision B of 2026-10-14 (add-notes-vault-connections). The notes units run ob as
    # ratatoskr-notes-sync, which creates trees/<id> and clients/<id>. The trees root is setgid with
    # the group ratatoskr-notes-trees, whose members are ratatoskr-notes and ratatoskr-notes-sync
    # (OBS-024, decision 7.11), so the notes service reads each tree and writes into it, ob changes
    # what notes wrote, and no other user reads a tree. The clients root holds the Sync token and the
    # end-to-end key in plain text, so only ratatoskr-notes-sync may enter it. The login and cleanup
    # units have both roots in ReadWritePaths= with no `-`, so systemd fails them when one does not
    # exist. The fixture tree is written as the units and the notes writer write, with umask 0007.
    # prepare.yml leaves a tree with the modes of umask 0027, which the converge must change.
    - name: "notes_trees_and_clients: the group of the trees"
      ansible.builtin.command: getent group ratatoskr-notes-trees
      register: notes_trees_group
      changed_when: false

    - name: "notes_trees_and_clients: the groups of ratatoskr-notes"
      ansible.builtin.command: id -nG ratatoskr-notes
      register: notes_user_groups
      changed_when: false

    - name: "notes_trees_and_clients: ratatoskr-notes and ratatoskr-notes-sync are the only members; ratatoskr-notes is in its own group, ratatoskr and the tree group"
      ansible.builtin.assert:
        that:
          - notes_trees_group.stdout.split(':')[3] | trim | split(',') | sort == ['ratatoskr-notes', 'ratatoskr-notes-sync']
          - (notes_user_groups.stdout.split() | first) == 'ratatoskr-notes'
          - notes_user_groups.stdout.split() | sort == ['ratatoskr', 'ratatoskr-notes', 'ratatoskr-notes-trees']
        fail_msg: "{{ notes_trees_group.stdout }}; id -nG ratatoskr-notes: {{ notes_user_groups.stdout }}"

    - name: "notes_trees_and_clients: the parent, the two roots and the old connections root"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /mnt/nvme/ratatoskr/notes
        - /mnt/nvme/ratatoskr/notes/trees
        - /mnt/nvme/ratatoskr/notes/clients
        - /mnt/nvme/ratatoskr/notes/connections
      register: notes_roots

    - name: "notes_trees_and_clients: parent root 0755; trees ratatoskr-notes-sync:ratatoskr-notes-trees 2770; clients ratatoskr-notes-sync 0700; no connections root"
      ansible.builtin.assert:
        that:
          - notes_roots.results[0].stat.isdir | default(false)
          - notes_roots.results[0].stat.pw_name == 'root'
          - notes_roots.results[0].stat.mode == '0755'
          - notes_roots.results[1].stat.isdir | default(false)
          - notes_roots.results[1].stat.pw_name == 'ratatoskr-notes-sync'
          - notes_roots.results[1].stat.gr_name == 'ratatoskr-notes-trees'
          - notes_roots.results[1].stat.mode == '2770'
          - notes_roots.results[2].stat.isdir | default(false)
          - notes_roots.results[2].stat.pw_name == 'ratatoskr-notes-sync'
          - notes_roots.results[2].stat.gr_name == 'ratatoskr-notes-sync'
          - notes_roots.results[2].stat.mode == '0700'
          - not notes_roots.results[3].stat.exists
        fail_msg: >-
          {% for result in notes_roots.results %}{{ result.item }}:
          {{ result.stat.pw_name | default('') }}:{{ result.stat.gr_name | default('') }}
          {{ result.stat.mode | default('missing') }}; {% endfor %}

    - name: "notes_trees_and_clients: a tree, written by ratatoskr-notes-sync with umask 0007"
      ansible.builtin.command:
        argv:
          - setpriv
          - --reuid=ratatoskr-notes-sync
          - --regid=ratatoskr-notes-sync
          - --init-groups
          - /bin/sh
          - -c
          - >-
            umask 0007
            && mkdir -p /mnt/nvme/ratatoskr/notes/trees/3f2b8c1e-5a4d-4e6f-9b7a-1c2d3e4f5a6b/folder
            && printf fixture > /mnt/nvme/ratatoskr/notes/trees/3f2b8c1e-5a4d-4e6f-9b7a-1c2d3e4f5a6b/folder/note.md
      changed_when: true

    - name: "notes_trees_and_clients: a folder and a note, written into the tree by ratatoskr-notes with umask 0007"
      ansible.builtin.command:
        argv:
          - setpriv
          - --reuid=ratatoskr-notes
          - --regid=ratatoskr-notes
          - --init-groups
          - /bin/sh
          - -c
          - >-
            umask 0007
            && mkdir /mnt/nvme/ratatoskr/notes/trees/3f2b8c1e-5a4d-4e6f-9b7a-1c2d3e4f5a6b/written
            && printf written > /mnt/nvme/ratatoskr/notes/trees/3f2b8c1e-5a4d-4e6f-9b7a-1c2d3e4f5a6b/written/note.md
      changed_when: true

    - name: "notes_trees_and_clients: the tree, its folder and its note"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: notes_tree_fixture
      loop:
        - /mnt/nvme/ratatoskr/notes/trees/3f2b8c1e-5a4d-4e6f-9b7a-1c2d3e4f5a6b
        - /mnt/nvme/ratatoskr/notes/trees/3f2b8c1e-5a4d-4e6f-9b7a-1c2d3e4f5a6b/folder
        - /mnt/nvme/ratatoskr/notes/trees/3f2b8c1e-5a4d-4e6f-9b7a-1c2d3e4f5a6b/folder/note.md
        - /mnt/nvme/ratatoskr/notes/trees/3f2b8c1e-5a4d-4e6f-9b7a-1c2d3e4f5a6b/written
        - /mnt/nvme/ratatoskr/notes/trees/3f2b8c1e-5a4d-4e6f-9b7a-1c2d3e4f5a6b/written/note.md
        - /mnt/nvme/ratatoskr/notes/trees/0b9e2f4a-7c1d-4e3b-8a6f-5d2c1b0a9e8f
        - /mnt/nvme/ratatoskr/notes/trees/0b9e2f4a-7c1d-4e3b-8a6f-5d2c1b0a9e8f/folder
        - /mnt/nvme/ratatoskr/notes/trees/0b9e2f4a-7c1d-4e3b-8a6f-5d2c1b0a9e8f/folder/note.md

    # prepare.yml made its tree as root before the users and the tree group existed, so the tree
    # keeps the owner and group root; its modes show that the converge changed 2750 and 0640 to
    # 2770 and 0660.
    - name: "notes_trees_and_clients: each inherits the tree group; directories 2770, the notes 0660"
      ansible.builtin.assert:
        that:
          - item.stat.pw_name == ('ratatoskr-notes' if '/written' in item.item else 'root' if '0b9e2f4a' in item.item else 'ratatoskr-notes-sync')
          - item.stat.gr_name == ('root' if '0b9e2f4a' in item.item else 'ratatoskr-notes-trees')
          - item.stat.mode == ('2770' if item.stat.isdir else '0660')
        fail_msg: "{{ item.item }}: {{ item.stat.pw_name }}:{{ item.stat.gr_name }} {{ item.stat.mode }}"
        quiet: true
      loop: "{{ notes_tree_fixture.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: "notes_trees_and_clients: ratatoskr-notes reads the tree, no other ratatoskr-* user reads it, and only ratatoskr-notes-sync enters the clients root"
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -uo pipefail
          note=/mnt/nvme/ratatoskr/notes/trees/3f2b8c1e-5a4d-4e6f-9b7a-1c2d3e4f5a6b/folder/note.md
          clients=/mnt/nvme/ratatoskr/notes/clients
          wrong=""
          as() { user="$1"; shift; setpriv --reuid="$user" --regid="$user" --init-groups "$@" >/dev/null 2>&1; }
          written=/mnt/nvme/ratatoskr/notes/trees/3f2b8c1e-5a4d-4e6f-9b7a-1c2d3e4f5a6b/written/note.md
          as ratatoskr-notes cat "$note" || wrong="${wrong}ratatoskr-notes cannot read the tree"$'\n'
          as ratatoskr-notes sh -c "printf changed >> $note" || wrong="${wrong}ratatoskr-notes cannot change a note of ob"$'\n'
          as ratatoskr-notes-sync sh -c "printf changed >> $written" || wrong="${wrong}ratatoskr-notes-sync cannot change a note that notes wrote"$'\n'
          as ratatoskr-notes-sync ls "$clients" || wrong="${wrong}ratatoskr-notes-sync cannot enter the clients root"$'\n'
          others=0
          for user in $(getent passwd | cut -d: -f1 | grep '^ratatoskr-'); do
            case "$user" in ratatoskr-notes-sync) continue ;; esac
            if as "$user" ls "$clients"; then wrong="${wrong}${user} enters the clients root"$'\n'; fi
            case "$user" in ratatoskr-notes) continue ;; esac
            others=$((others + 1))
            if as "$user" cat "$note"; then wrong="${wrong}${user} reads the tree"$'\n'; fi
          done
          [ "$others" -gt 0 ] || wrong="${wrong}no ratatoskr-* user outside the group to try"$'\n'
          printf '%s' "$wrong"
          [ -z "$wrong" ]
      changed_when: false

    - name: "notes_trees_and_clients: remove the fixture trees"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /mnt/nvme/ratatoskr/notes/trees/3f2b8c1e-5a4d-4e6f-9b7a-1c2d3e4f5a6b
        - /mnt/nvme/ratatoskr/notes/trees/0b9e2f4a-7c1d-4e3b-8a6f-5d2c1b0a9e8f

    # --- notes_journal_namespace ---------------------------------------------------------------------
    # Owner decision A of 2026-10-14. The sync unit logs to the journal namespace
    # ratatoskr-notes-sync, and ratatoskr-notes reads it with journalctl without the group
    # systemd-journal. The tmpfiles entry replaces the ACL of the namespace directory and of its
    # journal files, so they name the group ratatoskr-notes only: not the group adm that Debian puts
    # in the default ACL of /var/log/journal. journald@ratatoskr-notes-sync.conf bounds the
    # namespace to 8 MiB in files of 2 MiB, because /var/log is a 128 MiB log2ram tmpfs on the host.
    # The case logs one line through the namespace, as a sync unit does, so the instance starts with
    # the limits and writes a real journal file.
    - name: "notes_journal_namespace: the installed tmpfiles entry and journald configuration"
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
      loop:
        - /etc/tmpfiles.d/ratatoskr-notes-journal.conf
        - /etc/systemd/journald@ratatoskr-notes-sync.conf
      register: notes_journal_files

    - name: "notes_journal_namespace: the machine id"
      ansible.builtin.command: cat /etc/machine-id
      register: notes_machine_id
      changed_when: false

    - name: "notes_journal_namespace: one line logged through the namespace, as a sync unit logs"
      ansible.builtin.command:
        argv:
          - systemd-run
          - --wait
          - --quiet
          - --property=LogNamespace=ratatoskr-notes-sync
          - /bin/echo
          - molecule-notes-journal-probe
      changed_when: true

    - name: "notes_journal_namespace: the namespace directory"
      ansible.builtin.stat:
        path: "/var/log/journal/{{ notes_machine_id.stdout | trim }}.ratatoskr-notes-sync"
      register: notes_journal_dir

    - name: "notes_journal_namespace: the named groups of the ACLs of the directory and of each journal file"
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import glob, grp, json, os, struct, sys
            def groups(path, name):
                try:
                    raw = os.getxattr(path, name)
                except OSError:
                    return []
                entries = [struct.unpack('<HHI', raw[i:i + 8]) for i in range(4, len(raw), 8)]
                return sorted(f'{grp.getgrgid(ident).gr_name}:{perm}' for tag, perm, ident in entries if tag == 0x08)
            root = sys.argv[1]
            files = sorted(glob.glob(os.path.join(root, '*.journal*')))
            print(json.dumps({
                'access': groups(root, 'system.posix_acl_access'),
                'default': groups(root, 'system.posix_acl_default'),
                # A file takes the named entry of the default ACL; the mask of its mode 0640 makes
                # the entry r--, so only the group name is compared.
                'files': {os.path.basename(f): [g.split(':')[0] for g in groups(f, 'system.posix_acl_access')] for f in files},
                'bytes': sum(os.path.getsize(f) for f in files),
            }))
          - "/var/log/journal/{{ notes_machine_id.stdout | trim }}.ratatoskr-notes-sync"
      register: notes_journal_acl
      changed_when: false

    - name: "notes_journal_namespace: the instance logs the limits it read"
      ansible.builtin.command: journalctl --namespace=ratatoskr-notes-sync --output=cat
      register: notes_journal_usage
      changed_when: false

    - name: "notes_journal_namespace: the files are the workspace's; root:systemd-journal 2755; the ACLs name ratatoskr-notes only; at most 8 MiB"
      ansible.builtin.assert:
        that:
          - notes_journal_files.results[0].stat.checksum | default('') == (lookup('ansible.builtin.file', project ~ '/roles/host/files/ratatoskr-notes-journal.conf') ~ '\n') | hash('sha256')
          - notes_journal_files.results[1].stat.checksum | default('') == (lookup('ansible.builtin.file', project ~ '/roles/host/files/journald@ratatoskr-notes-sync.conf') ~ '\n') | hash('sha256')
          - notes_journal_dir.stat.isdir | default(false)
          - notes_journal_dir.stat.pw_name == 'root'
          - notes_journal_dir.stat.gr_name == 'systemd-journal'
          - notes_journal_dir.stat.mode == '2755'
          - (notes_journal_acl.stdout | from_json).access == ['ratatoskr-notes:5']
          - (notes_journal_acl.stdout | from_json).default == ['ratatoskr-notes:5']
          - (notes_journal_acl.stdout | from_json).files | length > 0
          - (notes_journal_acl.stdout | from_json).files.values() | map('join', ',') | unique | list == ['ratatoskr-notes']
          - (notes_journal_acl.stdout | from_json).bytes <= 8388608
          - notes_journal_usage.stdout is search('ratatoskr-notes-sync\) is [0-9.]+[KM], max 8\.0M')
        fail_msg: >-
          files: {{ notes_journal_files.results | map(attribute='stat.checksum', default='missing') | list }};
          directory: {{ notes_journal_dir.stat.pw_name | default('') }}:{{ notes_journal_dir.stat.gr_name | default('') }}
          {{ notes_journal_dir.stat.mode | default('missing') }}; ACL: {{ notes_journal_acl.stdout }};
          journald: {{ notes_journal_usage.stdout_lines | select('search', 'max') | list }}

    - name: "notes_journal_namespace: ratatoskr-notes reads the line with journalctl, and no other ratatoskr-* user can"
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -uo pipefail
          wrong=""
          reads() {
            setpriv --reuid="$1" --regid="$1" --init-groups \
              journalctl --namespace=ratatoskr-notes-sync --output=cat 2>/dev/null \
              | grep -q molecule-notes-journal-probe
          }
          reads ratatoskr-notes || wrong="${wrong}ratatoskr-notes cannot read the line"$'\n'
          others=0
          for user in $(getent passwd | cut -d: -f1 | grep '^ratatoskr-'); do
            case "$user" in ratatoskr-notes) continue ;; esac
            others=$((others + 1))
            if reads "$user"; then wrong="${wrong}${user} reads the line"$'\n'; fi
          done
          [ "$others" -gt 0 ] || wrong="${wrong}no other ratatoskr-* user to try"$'\n'
          printf '%s' "$wrong"
          [ -z "$wrong" ]
      changed_when: false

    # --- nats_up and seed_modes ---------------------------------------------------------------------
    - name: "nats_up: the broker answers its health check"
      ansible.builtin.uri:
        url: http://127.0.0.1:8222/healthz
        status_code: 200

    - name: "nats_up: the deployed configuration"
      ansible.builtin.slurp:
        src: /etc/nats/ratatoskr.conf
      register: nats_conf

    - name: "nats_up: no placeholder and no seed in it, and one public key per identity"
      ansible.builtin.assert:
        that:
          - "'REPLACE_ME' not in (nats_conf.content | b64decode)"
          - (nats_conf.content | b64decode) is not search('SU[A-Z2-7]{56}')
          - (nats_conf.content | b64decode | regex_findall('nkey:\s*U[A-Z2-7]{55}') | length) == 15

    - name: "seed_modes: each seed file"
      ansible.builtin.stat:
        path: "/etc/ratatoskr/{{ item.identity }}.nkey"
      register: seeds
      loop: "{{ (lookup('ansible.builtin.file', project ~ '/group_vars/all/services.json') | from_json).ratatoskr_nats_identities }}"
      loop_control:
        label: "{{ item.identity }}"

    - name: "seed_modes: root-owned, readable by its service group only, or root only when unenrolled"
      ansible.builtin.assert:
        that:
          - item.stat.pw_name == 'root'
          - item.stat.gr_name == item.item.group
          - item.stat.mode == ('0600' if item.item.group == 'root' else '0640')
        quiet: true
      loop: "{{ seeds.results }}"
      loop_control:
        label: "{{ item.item.identity }}"

    # --- services_ready -----------------------------------------------------------------------------
    - name: "services_ready: every enrolled operator listener answers its readiness path with 200"
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ item.operator_port }}{{ item.ready_path | default('/health/ready') }}"
        status_code: 200
      loop: "{{ services }}"
      loop_control:
        label: "{{ item.name }}"

    # --- monitoring_lines ---------------------------------------------------------------------------
    - name: "monitoring_lines: the three lines"
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: monitoring
      loop:
        - /opt/monitoring-fixture/docker-compose.yml
        - /opt/monitoring-fixture/promscrape.yml
        - /opt/monitoring-fixture/rules/ratatoskr-bus-alerts.rules.yml

    - name: "monitoring_lines: extra_hosts on the collector, the scrape job, the rule file"
      ansible.builtin.assert:
        that:
          - (monitoring.results[0].content | b64decode) is search('victoriametrics:\n\s+extra_hosts:\s*\["host\.docker\.internal:host-gateway"\]')
          - (monitoring.results[1].content | b64decode) is search('job_name:\s*ratatoskr')
          - (monitoring.results[1].content | b64decode) is search('job_name:\s*node')
          - (monitoring.results[2].content | b64decode | length) > 0

    # --- provision_order ----------------------------------------------------------------------------
    - name: "provision_order: the recorded events"
      ansible.builtin.slurp:
        src: "{{ state }}/provision.log"
      register: provision_log

    - name: "provision_order: the first time each event happened"
      ansible.builtin.set_fact:
        first: >-
          {{ dict((provision_log.content | b64decode).splitlines() | map('split', ' ') | reverse
                  | map('reverse') | list) }}

    - name: "provision_order: 01, then Edge ready, then 02-grants, then each role before its service"
      ansible.builtin.assert:
        that:
          - first['sql:01-database-and-roles'] | int < first['start:edge'] | int
          - first['start:edge'] | int < first['ready:edge'] | int
          - first['ready:edge'] | int < first['sql:02-grants'] | int
          - first['sql:02-grants'] | int < first['start:ingest'] | int
          - first['sql:02-grants'] | int < first['start:scheduler'] | int
          - first['sql:02-grants'] | int < first['sql:role-ratatoskr_extractor'] | int
          - first['sql:role-ratatoskr_extractor'] | int < first['start:extractor'] | int
          - first['sql:role-ratatoskr_telegram'] | int < first['start:telegram-webhook'] | int
          - first['ready:telegram-webhook'] | int < first['start:telegram-dispatcher'] | int
        fail_msg: "{{ provision_log.content | b64decode }}"

    # --- role_file_failure --------------------------------------------------------------------------
    - name: "role_file_failure: a role file that fails as written"
      ansible.builtin.copy:
        dest: /tmp/failing-role.sql
        content: "create role ratatoskr_fixture login;\nselect no_such_function();\n"
        mode: "0600"

    - name: "role_file_failure: run it as the playbook runs every role.sql"
      ratatoskr_sql:
        file: /tmp/failing-role.sql
        label: role-fixture
      register: failing
      ignore_errors: true

    - name: "role_file_failure: it stops, names the file, and leaves no marker to skip it next time"
      ansible.builtin.stat:
        path: "{{ state }}/sql/role-fixture.sha256"
      register: failing_marker

    - name: "role_file_failure: assert"
      ansible.builtin.assert:
        that:
          - failing is failed
          - "'/tmp/failing-role.sql' in failing.msg"
          - not failing_marker.stat.exists

    - name: "role_file_failure: clean up the fixture role"
      ansible.builtin.command:
        argv: [docker, exec, shared-postgres, psql, -U, postgres, -c, drop role if exists ratatoskr_fixture]
      changed_when: true

    # --- no_restart_on_rerun ------------------------------------------------------------------------
    - name: "no_restart_on_rerun: start times before"
      ansible.builtin.command: systemctl show -p ActiveEnterTimestampMonotonic --value {{ item.unit }}
      register: before
      changed_when: false
      loop: "{{ services }}"
      loop_control:
        label: "{{ item.unit }}"

    - name: "no_restart_on_rerun: run the playbook again"
      ansible.builtin.shell:
        cmd: "{{ playbook }} > {{ scratch }}/rerun.log 2>&1"
      delegate_to: localhost
      become: false
      changed_when: false

    - name: "no_restart_on_rerun: start times after"
      ansible.builtin.command: systemctl show -p ActiveEnterTimestampMonotonic --value {{ item.unit }}
      register: after
      changed_when: false
      loop: "{{ services }}"
      loop_control:
        label: "{{ item.unit }}"

    - name: "no_restart_on_rerun: nothing changed and nothing restarted"
      ansible.builtin.assert:
        that:
          - (before.results | map(attribute='stdout') | list) == (after.results | map(attribute='stdout') | list)
          - lookup('ansible.builtin.file', scratch ~ '/rerun.log') is search('changed=0\s')
        fail_msg: >-
          {{ lookup('ansible.builtin.file', scratch ~ '/rerun.log') | regex_search('PLAY RECAP[\\s\\S]*') }}
          Start times (unit, before, after):
          {{ services | map(attribute='unit') | zip(before.results | map(attribute='stdout'), after.results | map(attribute='stdout')) | list }}

    # --- freeze_guard -------------------------------------------------------------------------------
    - name: "freeze_guard: the same target, not marked as a test target"
      ansible.builtin.shell:
        cmd: "{{ playbook }} -e ratatoskr_test_target=false > {{ scratch }}/frozen.log 2>&1"
      register: frozen
      failed_when: frozen.rc == 0
      delegate_to: localhost
      become: false
      changed_when: false

    - name: "freeze_guard: refused before any change, naming the freeze and the document"
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.file', scratch ~ '/frozen.log') is search('DEPLOYMENT_TARGET\.md')
          - lookup('ansible.builtin.file', scratch ~ '/frozen.log') is search('The host is frozen')
          - lookup('ansible.builtin.file', scratch ~ '/frozen.log') is not search('changed=[1-9]')

    # --- pins_match_lock ----------------------------------------------------------------------------
    - name: "pins_match_lock: a lock whose extractor commit is not the submodule's"
      ansible.builtin.shell:
        cmd: >-
          sed 's/{{ pins.extractor.commit }}/{{ '0' * 40 }}/' {{ workspace }}/workspace.lock
          > {{ scratch }}/workspace.lock
      delegate_to: localhost
      become: false
      changed_when: false

    - name: "pins_match_lock: the playbook against that lock"
      ansible.builtin.shell:
        cmd: >-
          {{ playbook }} -e ratatoskr_lock_file={{ scratch }}/workspace.lock > {{ scratch }}/pins.log 2>&1
      register: pins_run
      failed_when: pins_run.rc == 0
      delegate_to: localhost
      become: false
      changed_when: false

    - name: "pins_match_lock: refused in preflight, naming the extractor"
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.file', scratch ~ '/pins.log') is search('Each submodule is at its pinned commit')
          - lookup('ansible.builtin.file', scratch ~ '/pins.log') is search('extractor')
          - lookup('ansible.builtin.file', scratch ~ '/pins.log') is not search('changed=[1-9]')

    # --- artifact_tamper ----------------------------------------------------------------------------
    - name: "artifact_tamper: a copy of the controller cache with one byte changed in one binary"
      ansible.builtin.shell:
        cmd: >-
          rm -rf {{ scratch }}/cache && cp -R {{ lookup('env', 'HOME') }}/.cache/ratatoskr-deploy/artifacts {{ scratch }}/cache
          && f={{ scratch }}/cache/extractor/{{ pins.extractor.commit }}/ratatoskr-extractor
          && chmod u+w "$f" && printf 'X' | dd of="$f" bs=1 seek=4096 conv=notrunc 2>/dev/null
      delegate_to: localhost
      become: false
      changed_when: false

    - name: "artifact_tamper: the playbook against the tampered cache"
      ansible.builtin.shell:
        cmd: >-
          {{ playbook }} -e ratatoskr_artifact_cache={{ scratch }}/cache > {{ scratch }}/tamper.log 2>&1
      register: tamper_run
      failed_when: tamper_run.rc == 0
      delegate_to: localhost
      become: false
      changed_when: false

    - name: "artifact_tamper: refused on the checksum, before the binary reaches the host"
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.file', scratch ~ '/tamper.log') is search('ratatoskr-extractor: does not match SHA256SUMS')
          - lookup('ansible.builtin.file', scratch ~ '/tamper.log') is not search('changed=[1-9]')

    # --- no_secret_in_output ------------------------------------------------------------------------
    - name: "no_secret_in_output: make the playbook generate and set one password again"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/ratatoskr/secrets/postgres/ratatoskr_github.password
        - "{{ state }}/sql/password-ratatoskr_github.sha256"

    - name: "no_secret_in_output: a verbose run that generates it"
      ansible.builtin.shell:
        cmd: "{{ playbook }} -vvv > {{ scratch }}/secrets.log 2>&1"
      delegate_to: localhost
      become: false
      changed_when: false

    - name: "no_secret_in_output: every secret on the host"
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          cat /etc/ratatoskr/secrets/postgres/*.password /etc/ratatoskr/*.nkey \
              /etc/ratatoskr/secrets/telegram-webhook /etc/ratatoskr/secrets/channel-digests-service-secret \
              /etc/ratatoskr/secrets/telegram-platform-signing-key /etc/ratatoskr/secrets/telegram-bot-token \
              /etc/ratatoskr/secrets/openrouter-api-key /etc/ratatoskr/secrets/github-readme-service-secret \
              /etc/ratatoskr/secrets/channel-digests-source-secret \
              /etc/ratatoskr/secrets/channel-digests-result-reader-secret \
            | sed '/^$/d'
        executable: /bin/bash
      register: host_secrets
      changed_when: false
      no_log: true

    - name: "no_secret_in_output: none of them is in the output of a run"
      ansible.builtin.assert:
        that: >-
          host_secrets.stdout_lines
          | select('in', lookup('ansible.builtin.file', scratch ~ '/secrets.log')) | list | length == 0
        fail_msg: a secret generated on the host appears in the playbook's output
        quiet: true
      no_log: true

    # --- stop_as_one --------------------------------------------------------------------------------
    # The converge must leave the deployment as a boot leaves it. While the target is inactive,
    # `systemctl stop ratatoskr.target` is a no-op and every unit keeps running.
    - name: "stop_as_one: the converge left ratatoskr.target active"
      ansible.builtin.command: systemctl is-active ratatoskr.target
      register: target
      failed_when: target.stdout | trim != 'active'
      changed_when: false

    - name: "stop_as_one: stop the target"
      ansible.builtin.systemd_service:
        name: ratatoskr.target
        state: stopped

    # `systemctl stop` returns once the target's own job is done; each unit then drains for up to
    # its grace period, the roles ordered after Edge first. So wait for each one to reach inactive.
    - name: "stop_as_one: every enrolled unit is stopped"
      ansible.builtin.command: systemctl is-active {{ item.unit }}
      register: stopped
      until: stopped.stdout | trim in ['inactive', 'failed']
      retries: 45
      delay: 2
      failed_when: stopped.stdout | trim not in ['inactive', 'failed']
      changed_when: false
      loop: "{{ services }}"
      loop_control:
        label: "{{ item.unit }}"

    - name: "stop_as_one: the database and the bus are still up"
      ansible.builtin.command:
        argv: [docker, inspect, -f, "{{ '{{' }}.State.Running{{ '}}' }}", "{{ item }}"]
      register: containers
      failed_when: containers.stdout | trim != 'true'
      changed_when: false
      loop: [shared-postgres, ratatoskr-nats]

    - name: "stop_as_one: start the target again"
      ansible.builtin.systemd_service:
        name: ratatoskr.target
        state: started

    - name: "stop_as_one: every enrolled service is ready again"
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ item.operator_port }}{{ item.ready_path | default('/health/ready') }}"
        status_code: 200
      register: again
      until: again.status == 200
      retries: 60
      delay: 2
      loop: "{{ services }}"
      loop_control:
        label: "{{ item.name }}"
