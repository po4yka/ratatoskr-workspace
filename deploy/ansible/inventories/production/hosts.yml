# The one host (docs/DEPLOYMENT_TARGET.md). Its address is the operator's, so it is read from the
# environment rather than written here: RATATOSKR_HOST=<tailscale name> ansible-playbook ...
#
# The playbook refuses this host while DEPLOYMENT_TARGET.md says it is frozen.
all:
  hosts:
    ratatoskr-host:
      ansible_host: "{{ lookup('env', 'RATATOSKR_HOST') | default('ratatoskr-host', true) }}"
      ansible_become: true
