# The journal namespace of the notes sync units (LogNamespace=ratatoskr-notes-sync, owner decision A
# of 2026-10-14 in add-notes-vault-connections). ratatoskr-notes reads this namespace with
# journalctl and is not in the group systemd-journal. %m is the machine id.
#
# DEVELOPMENT.md of ratatoskr-notes gives the entry with `A+`. Here `A` replaces the ACL instead,
# so the directory does not keep the group adm that Debian's systemd.conf puts in the default ACL
# of /var/log/journal. The ACL and the default ACL name the group ratatoskr-notes only, beside the
# owner root and the group systemd-journal of the mode. The last line does the same for a journal
# file that exists already, so no file keeps an adm entry. journald runs as root and needs neither.
d  /var/log/journal/%m.ratatoskr-notes-sync 2755 root systemd-journal - -
A  /var/log/journal/%m.ratatoskr-notes-sync - - - - group:ratatoskr-notes:r-x,d:group:ratatoskr-notes:r-x
A  /var/log/journal/%m.ratatoskr-notes-sync/*.journal* - - - - group:ratatoskr-notes:r--
