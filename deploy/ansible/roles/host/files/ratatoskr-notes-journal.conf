# The journal namespace of the notes sync units (LogNamespace=ratatoskr-notes-sync, owner decision A
# of 2026-10-14 in add-notes-vault-connections). ratatoskr-notes reads this namespace with
# journalctl and is not in the group systemd-journal. The ACL and the default ACL give the group
# ratatoskr-notes read access to this namespace and to no other journal. %m is the machine id.
# The text is the entry that DEVELOPMENT.md of ratatoskr-notes gives.
d  /var/log/journal/%m.ratatoskr-notes-sync 2755 root systemd-journal - -
A+ /var/log/journal/%m.ratatoskr-notes-sync - - - - group:ratatoskr-notes:r-x,d:group:ratatoskr-notes:r-x
