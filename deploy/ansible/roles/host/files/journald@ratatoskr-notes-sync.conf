# The journald instance of the namespace ratatoskr-notes-sync (systemd-journald@ratatoskr-notes-sync),
# which the notes sync units log to. It reads this file when it starts.
#
# /var/log on the host is a 128 MiB log2ram tmpfs, about 79 % full (docs/DEPLOYMENT_TARGET.md), so
# about 27 MiB is free for the system journal, the other logs and this namespace together.
# - SystemMaxUse=8M: the namespace takes at most 8 MiB, about 6 % of /var/log. ob logs a few lines
#   per sync and one failure line at most every 5 seconds, so 8 MiB holds days of lines, and the
#   notes service follows the journal live.
# - SystemMaxFileSize=2M: four files, so a rotation drops 2 MiB of the oldest lines and not all.
#   journald preallocates each file up to this size.
# - SystemKeepFree=8M: journald stops writing here when less than 8 MiB of /var/log is free. The
#   default, 15 % (about 19 MiB), would stop the namespace while the system journal still writes.
# - RuntimeMaxUse=4M, RuntimeMaxFileSize=1M: the bound in /run (RAM), which journald uses only
#   while /var/log is not writable.
[Journal]
Storage=persistent
SystemMaxUse=8M
SystemMaxFileSize=2M
SystemKeepFree=8M
RuntimeMaxUse=4M
RuntimeMaxFileSize=1M
