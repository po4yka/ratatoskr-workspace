# Every host fact a reflash resets and Ratatoskr depends on (DEPLOYMENT_TARGET.md "What the reflash
# resets"): users, groups, directories, the target, logrotate and tmpfiles, and the firewall rule.

- name: The shared groups
  ansible.builtin.group:
    name: "{{ item }}"
    system: true
  loop: "{{ ratatoskr_groups }}"

- name: Each service user's own group, which `user` names as the primary group
  ansible.builtin.group:
    name: "{{ item.name }}"
    system: true
  loop: "{{ ratatoskr_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: One system user per service
  ansible.builtin.user:
    name: "{{ item.name }}"
    group: "{{ item.name }}"
    groups: "{{ item.groups }}"
    append: false
    system: true
    create_home: false
    shell: /usr/sbin/nologin
  loop: "{{ ratatoskr_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: The directories, each with the one owner and mode the deploy guides agree on
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ ratatoskr_directories + [{'path': ratatoskr_state_dir, 'owner': 'root', 'group': 'root', 'mode': '0700'}] }}"
  loop_control:
    label: "{{ item.path }}"

# OBS-024, decision 7.11: the notes service writes into the working trees, and ob changes what it
# wrote, so the tree group may write both. The directory task above sets the trees root to 2770; that
# is the one change root makes. A tree made before OBS-024 keeps the modes of UMask=0027 (folders
# 2750, files 0640) until the one-time migration below changes them.
#
# ratatoskr-notes and ratatoskr-notes-sync can write inside the trees, so a link planted there could
# lead a root chmod to any path of the host. The migration therefore runs as ratatoskr-notes-sync,
# which made every tree before OBS-024, and never as root: find does not follow a link (-P), takes
# only folders and regular files that ratatoskr-notes-sync owns, and chmod can change nothing that
# ratatoskr-notes-sync does not own. A marker file in the parent of the trees root, which belongs to
# root and which no service can write, records that the migration ran, so a later run leaves the
# trees alone.
- name: Whether the working trees were migrated to the modes of decision 7.11
  ansible.builtin.stat:
    path: "{{ ratatoskr_notes_trees_migration_marker }}"
  register: ratatoskr_notes_trees_migrated

- name: The folders and files of each tree made before OBS-024, writable by the tree group
  ansible.builtin.command:
    argv:
      - find
      - -P
      - /mnt/nvme/ratatoskr/notes/trees
      - -mindepth
      - "1"
      - -user
      - ratatoskr-notes-sync
      - (
      - -type
      - d
      - "!"
      - -perm
      - "2770"
      - -exec
      - chmod
      - "2770"
      - "{}"
      - +
      - )
      - -o
      - (
      - -type
      - f
      - "!"
      - -perm
      - "0660"
      - -exec
      - chmod
      - "0660"
      - "{}"
      - +
      - )
  become: true
  become_user: ratatoskr-notes-sync
  vars:
    ansible_pipelining: true
  when: not ratatoskr_notes_trees_migrated.stat.exists
  changed_when: true

- name: The marker of the migration, which root owns and no service can write
  ansible.builtin.copy:
    dest: "{{ ratatoskr_notes_trees_migration_marker }}"
    content: "OBS-024 decision 7.11: the trees made before it are 2770 and 0660.\n"
    owner: root
    group: root
    mode: "0644"
  when: not ratatoskr_notes_trees_migrated.stat.exists

- name: The playbook's own host state
  ansible.builtin.file:
    path: "{{ ratatoskr_state_dir }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop: [sources, sql, nkeys]

- name: The target, logrotate and tmpfiles files, unchanged from their pinned repositories
  ansible.builtin.copy:
    src: "{{ ratatoskr_workspace_root }}/{{ ratatoskr_pins[item.repository].path }}/{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop: "{{ ratatoskr_host_files }}"
  loop_control:
    label: "{{ item.dest }}"
  register: ratatoskr_host_files_result

- name: Create what tmpfiles.d declares, now rather than at the next boot
  ansible.builtin.command:
    cmd: systemd-tmpfiles --create /etc/tmpfiles.d/ratatoskr-platform.conf
  when: ratatoskr_host_files_result.results | selectattr('changed') | map(attribute='item.dest') | select('match', '/etc/tmpfiles.d/') | list | length > 0
  changed_when: true

- name: The tmpfiles entry of the notes journal namespace, which the workspace owns
  ansible.builtin.copy:
    src: ratatoskr-notes-journal.conf
    dest: /etc/tmpfiles.d/ratatoskr-notes-journal.conf
    owner: root
    group: root
    mode: "0644"
  register: ratatoskr_notes_journal_tmpfiles

- name: Create the notes journal namespace directory and its ACL now rather than at the next boot
  ansible.builtin.command:
    cmd: systemd-tmpfiles --create /etc/tmpfiles.d/ratatoskr-notes-journal.conf
  when: ratatoskr_notes_journal_tmpfiles.changed
  changed_when: true

- name: The size limits of the notes journal namespace, which the workspace owns
  ansible.builtin.copy:
    src: journald@ratatoskr-notes-sync.conf
    dest: /etc/systemd/journald@ratatoskr-notes-sync.conf
    owner: root
    group: root
    mode: "0644"
  register: ratatoskr_notes_journald_conf

# The instance reads the file only when it starts. It starts when the first sync unit logs, so a
# restart is needed only when it already runs; try-restart leaves a stopped instance stopped.
- name: A running journald instance of the namespace reads the new limits
  ansible.builtin.command:
    cmd: systemctl try-restart systemd-journald@ratatoskr-notes-sync.service
  when: ratatoskr_notes_journald_conf.changed
  changed_when: true

- name: Boot starts the deployment through ratatoskr.target
  ansible.builtin.systemd_service:
    name: ratatoskr.target
    enabled: true
    daemon_reload: true

- name: The monitoring bridge reaches the operator listeners through the host firewall
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - proto
      - tcp
      - from
      - "{{ ratatoskr_monitoring_subnet }}"
      - to
      - any
      - port
      - "{{ ratatoskr_monitoring_ports }}"
      - comment
      - ratatoskr operator listeners, from the monitoring bridge
  register: ratatoskr_ufw
  changed_when: "'Skipping' not in ratatoskr_ufw.stdout"
